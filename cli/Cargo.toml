[package]
name = "jura"
version = "1.2.0-dev"
description = "Command-line client for the Jura Trace local REST API."
authors = ["Paul Griffiths"]
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Jura-Labs/jura-trace-dev"
homepage = "https://juralabs.org"
# Reserved on crates.io, claimed when the CLI first ships publicly
# (docs/design/v1.2.0-headless-api-and-cli.md section 5.1).
publish = false

# A crate of its own beside src-tauri, not a member of a workspace with it.
# A root workspace would move src-tauri's Cargo.lock and target directory,
# which the release workflow, the Tauri bundler and the CI cache all name by
# path. The CLI shares no code with the app: its only contract is the API's
# JSON, and its tests run in the same CI workflow as the server's.
[workspace]

[[bin]]
name = "jura"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
# rustls rather than the platform TLS: the CLI talks to a loopback server by
# default, and this keeps the binary free of OpenSSL on Linux.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde_json = "1"
# v1 mode: Keychain on macOS, Credential Manager on Windows, Secret Service
# over a pure-Rust D-Bus client on Linux (no libdbus needed to build).
keyring = "4.2"

[profile.release]
strip = true
lto = "thin"

[dev-dependencies]
tempfile = "3"
