# Cloudflare Worker configuration for the Jura Trace auto-updater
# endpoint. Deploy with `wrangler deploy` after authenticating against
# the juralabs.org Cloudflare account.
#
# Routes are registered against the juralabs.org zone so the worker
# answers https://juralabs.org/api/updates/*.

name = "jura-trace-updater"
main = "src/index.ts"
compatibility_date = "2026-05-20"
compatibility_flags = ["nodejs_compat"]

# Production routes. juralabs.org zone must be on the same Cloudflare
# account as the worker. The /api/updates/* prefix matches both the
# /api/updates/latest.json aggregated endpoint and the per-platform
# /api/updates/{platform}/{current-version} routes.
[[routes]]
pattern = "juralabs.org/api/updates/*"
zone_name = "juralabs.org"

# Observability. Cloudflare's free plan includes basic logs; enable
# tail-log streaming for local development via `wrangler tail`.
[observability]
enabled = true

# Secrets are set via `wrangler secret put`:
#   wrangler secret put GITHUB_TOKEN
#
# GITHUB_TOKEN must be a PAT with `public_repo` scope on
# juralabs/jura-trace. Read-only access to releases is sufficient; the
# worker does not modify any GitHub state.
#
# Optional vars (non-secret) can be set via `[vars]`:
[vars]
GITHUB_REPO = "juralabs/jura-trace"

# ── Update-check counts (loop L4, approved 2026-09-06) ──────────────────────
#
# Counts how many update checks arrive per day, per route. Nothing about the
# device is recorded: no IP, no user agent, no header, no identifier. Two
# installs are indistinguishable, and one install checking twice is
# indistinguishable from two checking once.
#
# This is the first field signal Trace has ever had. Cloudflare's free plan
# keeps request-level analytics for one day, which is why the count has to be
# written by the worker rather than read back from analytics later.
#
# The binding is OPTIONAL in the code. Until the namespace exists and the
# block below is uncommented, the worker runs exactly as before and counting
# is skipped. Nothing fails for want of a counter.
#
# To enable:
#   wrangler kv namespace create UPDATE_COUNTS
#   # paste the returned id below, uncomment, then:
#   wrangler deploy
#
# To read:
#   wrangler kv key list --binding UPDATE_COUNTS
#   wrangler kv key get  --binding UPDATE_COUNTS "checks:2026-09-06:latest"
#
# Keys are checks:<YYYY-MM-DD>:<bucket>, where bucket is "latest" for the
# aggregated endpoint every v1.0.0 install polls, or "<platform>" and
# "<platform>:<version>" for the per-platform route. Keys expire after 100
# days.
#
# [[kv_namespaces]]
# binding = "UPDATE_COUNTS"
# id = "<id from wrangler kv namespace create>"
