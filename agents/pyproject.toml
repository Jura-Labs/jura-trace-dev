[project]
name = "jura-agents"
version = "0.1.0"
description = "Advisory agent system for Jura Archive development"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.42.0",
    "rich>=13.0",
    "click>=8.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
jura-agents = "agents.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
