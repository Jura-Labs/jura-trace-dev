<?xml version="1.0" encoding="UTF-8"?>
<!--
  Jura Trace social card — Variant B (centred composition).
  Eye-mark above wordmark, all centred. More formal/editorial.
  1280 × 640.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">

  <rect width="1280" height="640" fill="#1E2128"/>
  <rect width="1280" height="640" fill="url(#stratum)"/>

  <!-- Eye-mark, centred, larger -->
  <g transform="translate(640, 220) scale(1.05)" stroke-linejoin="round">
    <path d="M -114 -1 C -38.67 -99.67, 38.67 -99.67, 114 -1 C 38.67 97.67, -38.67 97.67, -114 -1 Z"
          fill="none" stroke="#5A85B5" stroke-width="16"/>
    <circle cx="1.62" cy="-0.62" r="54.62" fill="#7DA771" stroke="#5A85B5" stroke-width="12"/>
    <circle cx="2" cy="-1" r="22" fill="#000000"/>
    <circle cx="9.97" cy="-16.68" r="4.32" fill="#EDEAE4"/>
  </g>

  <!-- Earth-line under eye -->
  <rect x="450" y="370" width="380" height="2" fill="url(#earthline)" opacity="0.7"/>

  <!-- Wordmark, centred -->
  <text x="640" y="438" text-anchor="middle"
        font-family="'Source Serif 4', Georgia, serif"
        font-size="72" font-weight="700"
        fill="#EDEAE4">Jura Trace</text>

  <!-- Tagline, centred italic -->
  <text x="640" y="486" text-anchor="middle"
        font-family="'Source Serif 4', Georgia, serif"
        font-size="32" font-style="italic"
        fill="#7AA0CC">Know What's Real.</text>

  <!-- Sub, centred -->
  <text x="640" y="540" text-anchor="middle"
        font-family="'Source Sans 3', 'Avenir Next', sans-serif"
        font-size="22" font-weight="500" letter-spacing="1"
        fill="#ABA8A0">Forensic media verification  ·  Local-first  ·  Free for not-for-profits</text>

  <!-- URL bottom-centre -->
  <text x="640" y="598" text-anchor="middle"
        font-family="'Source Sans 3', sans-serif"
        font-size="18" font-weight="500" letter-spacing="2"
        fill="#5A85B5">JURALABS.ORG</text>

  <defs>
    <pattern id="stratum" x="0" y="0" width="1280" height="80" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1280" height="1" fill="#EDEAE4" opacity="0.04"/>
      <rect x="0" y="40" width="1280" height="1" fill="#EDEAE4" opacity="0.02"/>
    </pattern>
    <linearGradient id="earthline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5A85B5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7AA0CC"/>
      <stop offset="100%" stop-color="#7DA771" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
