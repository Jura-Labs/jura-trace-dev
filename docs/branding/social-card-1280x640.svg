<?xml version="1.0" encoding="UTF-8"?>
<!--
  Jura Trace — Social / OG card master.
  1280 × 640 (2:1) — the spec for GitHub social preview, X/Twitter,
  LinkedIn, Bluesky, Discord, Slack, iMessage, and most other platforms.

  This file is editable in Adobe Illustrator (or Figma, or any vector tool).
  Replace the Georgia placeholder fonts with the brand fonts of your choice
  (Adobe Fonts recommendations are in BRAND_KIT.md).

  Eye-mark uses the almond/lens form (matches the iconic eye reference).
  Geometry: two arcs from circles offset vertically by 75 units,
  radius 125, in a 256-unit reference space — see logo-eye-mark.svg.

  Safe area: keep critical content within 80 px of every edge — small
  preview crops can clip the outer band.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1280 640" width="1280" height="640">

  <!-- ── Background ────────────────────────────────────────────────── -->
  <rect width="1280" height="640" fill="#1E2128"/>
  <rect width="1280" height="640" fill="url(#stratum)"/>

  <!-- Earth-line (lapis → malachite gradient) -->
  <rect x="0" y="232" width="1280" height="2" fill="url(#earthline)" opacity="0.5"/>

  <!-- ── Eye-mark logo (almond/lens form, scaled 1.10) ─────────────── -->
  <!-- Mirrors docs/branding/logo-eye-mark.svg: lapis almond + malachite iris -->
  <g transform="translate(176, 320) scale(1.10)" stroke-linejoin="round">
    <!-- Almond outline (lapis) -->
    <path d="M -114 -1 C -38.67 -99.67, 38.67 -99.67, 114 -1 C 38.67 97.67, -38.67 97.67, -114 -1 Z"
          fill="none" stroke="#5A85B5" stroke-width="16"/>
    <!-- Iris (malachite fill, lapis ring) -->
    <circle cx="1.62" cy="-0.62" r="54.62" fill="#7DA771" stroke="#5A85B5" stroke-width="12"/>
    <!-- Pupil (true black for max contrast against malachite) -->
    <circle cx="2" cy="-1" r="22" fill="#000000"/>
    <!-- Catchlight (quartz, top-right convention) -->
    <circle cx="9.97" cy="-16.68" r="4.32" fill="#EDEAE4"/>
  </g>

  <!-- ── Wordmark ──────────────────────────────────────────────────── -->
  <text x="328" y="280"
        font-family="Georgia, 'Source Serif 4', 'Freight Text Pro', serif"
        font-size="100" font-weight="700"
        fill="#EDEAE4">Jura Trace</text>

  <!-- ── Tagline ───────────────────────────────────────────────────── -->
  <text x="332" y="352"
        font-family="Georgia, 'Source Serif 4', 'Freight Text Pro', serif"
        font-size="56" font-style="italic"
        fill="#7AA0CC">Know What's Real.</text>

  <!-- ── Sub-header ────────────────────────────────────────────────── -->
  <text x="334" y="420"
        font-family="'Source Sans 3', 'Avenir Next', 'Inter', sans-serif"
        font-size="28" font-weight="500" letter-spacing="0.5"
        fill="#ABA8A0">Forensic media verification  ·  Local-first  ·  Free for not-for-profits</text>

  <!-- ── Version pill ──────────────────────────────────────────────── -->
  <g transform="translate(56, 542)">
    <rect width="220" height="40" rx="20"
          fill="#5A85B5" fill-opacity="0.14"
          stroke="#7AA0CC" stroke-opacity="0.6" stroke-width="1"/>
    <text x="110" y="26" text-anchor="middle"
          font-family="'Source Sans 3', 'Avenir Next', sans-serif"
          font-size="20" font-weight="500"
          fill="#7AA0CC">v0.9 release candidate</text>
  </g>

  <!-- ── URL ───────────────────────────────────────────────────────── -->
  <text x="1224" y="582" text-anchor="end"
        font-family="'Source Sans 3', 'Avenir Next', sans-serif"
        font-size="22" font-weight="500"
        fill="#ABA8A0">juralabs.org</text>

  <!-- ── Defs ──────────────────────────────────────────────────────── -->
  <defs>
    <pattern id="stratum" x="0" y="0" width="1280" height="80" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1280" height="1" fill="#EDEAE4" opacity="0.04"/>
      <rect x="0" y="40" width="1280" height="1" fill="#EDEAE4" opacity="0.02"/>
    </pattern>

    <linearGradient id="earthline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5A85B5"/>
      <stop offset="50%" stop-color="#7AA0CC"/>
      <stop offset="100%" stop-color="#7DA771"/>
    </linearGradient>
  </defs>
</svg>
