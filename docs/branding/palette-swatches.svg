<?xml version="1.0" encoding="UTF-8"?>
<!--
  Jura Trace mineral palette.
  Open in Illustrator and use Window → Swatches → Open Swatch Library
  to import these into your project's swatch panel.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <rect width="800" height="480" fill="#FAFAF7"/>

  <!-- Row 1: dark surfaces -->
  <g transform="translate(40, 40)">
    <rect width="160" height="120" fill="#1E2128"/>
    <text x="80" y="150" text-anchor="middle" font-family="Avenir Next, sans-serif" font-size="14" fill="#1E2128">Obsidian</text>
    <text x="80" y="170" text-anchor="middle" font-family="Menlo, monospace" font-size="12" fill="#78756D">#1E2128</text>
  </g>
  <g transform="translate(220, 40)">
    <rect width="160" height="120" fill="#272B34"/>
    <text x="80" y="150" text-anchor="middle" font-family="Avenir Next, sans-serif" font-size="14" fill="#1E2128">Graphite</text>
    <text x="80" y="170" text-anchor="middle" font-family="Menlo, monospace" font-size="12" fill="#78756D">#272B34</text>
  </g>
  <g transform="translate(400, 40)">
    <rect width="160" height="120" fill="#EDEAE4"/>
    <text x="80" y="150" text-anchor="middle" font-family="Avenir Next, sans-serif" font-size="14" fill="#1E2128">Quartz</text>
    <text x="80" y="170" text-anchor="middle" font-family="Menlo, monospace" font-size="12" fill="#78756D">#EDEAE4</text>
  </g>
  <g transform="translate(580, 40)">
    <rect width="160" height="120" fill="#FAFAF7"/>
    <rect width="160" height="120" fill="none" stroke="#D8D5CE" stroke-width="1"/>
    <text x="80" y="150" text-anchor="middle" font-family="Avenir Next, sans-serif" font-size="14" fill="#1E2128">Bone</text>
    <text x="80" y="170" text-anchor="middle" font-family="Menlo, monospace" font-size="12" fill="#78756D">#FAFAF7</text>
  </g>

  <!-- Row 2: accent colours -->
  <g transform="translate(40, 200)">
    <rect width="160" height="120" fill="#5A85B5"/>
    <text x="80" y="150" text-anchor="middle" font-family="Avenir Next, sans-serif" font-size="14" fill="#1E2128">Lapis</text>
    <text x="80" y="170" text-anchor="middle" font-family="Menlo, monospace" font-size="12" fill="#78756D">#5A85B5</text>
  </g>
  <g transform="translate(220, 200)">
    <rect width="160" height="120" fill="#7AA0CC"/>
    <text x="80" y="150" text-anchor="middle" font-family="Avenir Next, sans-serif" font-size="14" fill="#1E2128">Lapis light</text>
    <text x="80" y="170" text-anchor="middle" font-family="Menlo, monospace" font-size="12" fill="#78756D">#7AA0CC</text>
  </g>
  <g transform="translate(400, 200)">
    <rect width="160" height="120" fill="#7DA771"/>
    <text x="80" y="150" text-anchor="middle" font-family="Avenir Next, sans-serif" font-size="14" fill="#1E2128">Malachite</text>
    <text x="80" y="170" text-anchor="middle" font-family="Menlo, monospace" font-size="12" fill="#78756D">#7DA771</text>
  </g>
  <g transform="translate(580, 200)">
    <rect width="160" height="120" fill="#DD8C84"/>
    <text x="80" y="150" text-anchor="middle" font-family="Avenir Next, sans-serif" font-size="14" fill="#1E2128">Cinnabar</text>
    <text x="80" y="170" text-anchor="middle" font-family="Menlo, monospace" font-size="12" fill="#78756D">#DD8C84</text>
  </g>

  <!-- Row 3: text + neutrals -->
  <g transform="translate(40, 360)">
    <rect width="160" height="80" fill="#5C5A55"/>
    <text x="80" y="110" text-anchor="middle" font-family="Avenir Next, sans-serif" font-size="14" fill="#1E2128">Flint dark</text>
    <text x="80" y="130" text-anchor="middle" font-family="Menlo, monospace" font-size="12" fill="#78756D">#5C5A55</text>
  </g>
  <g transform="translate(220, 360)">
    <rect width="160" height="80" fill="#ABA8A0"/>
    <text x="80" y="110" text-anchor="middle" font-family="Avenir Next, sans-serif" font-size="14" fill="#1E2128">Flint light</text>
    <text x="80" y="130" text-anchor="middle" font-family="Menlo, monospace" font-size="12" fill="#78756D">#ABA8A0</text>
  </g>
  <g transform="translate(400, 360)">
    <rect width="160" height="80" fill="#8C5F22"/>
    <text x="80" y="110" text-anchor="middle" font-family="Avenir Next, sans-serif" font-size="14" fill="#1E2128">Amber dark</text>
    <text x="80" y="130" text-anchor="middle" font-family="Menlo, monospace" font-size="12" fill="#78756D">#8C5F22</text>
  </g>
  <g transform="translate(580, 360)">
    <rect width="160" height="80" fill="#D8D5CE"/>
    <text x="80" y="110" text-anchor="middle" font-family="Avenir Next, sans-serif" font-size="14" fill="#1E2128">Quartz dim</text>
    <text x="80" y="130" text-anchor="middle" font-family="Menlo, monospace" font-size="12" fill="#78756D">#D8D5CE</text>
  </g>
</svg>
