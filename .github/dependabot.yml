# Dependabot configuration.
#
# Rewritten 4 September 2026, after all four active ecosystems were found
# sitting at exactly five open pull requests, which is the default
# `open-pull-requests-limit`. Saturated in every ecosystem means Dependabot
# could not open a pull request for any new version update until a human
# cleared the queue. Nobody had for five months. (The 4 September rewrite
# said security advisories were blocked too. They are not: the GitHub docs
# state that security update pull requests "are not subject to this limit
# and do not count toward it". Corrected 8 September. The saturation was
# still a problem, just a smaller one than the earlier text claimed.)
#
# Two changes address that, and they are not the same change:
#
#   * `groups` is the fix. Twenty separate pull requests become roughly six,
#     because routine minor and patch bumps arrive together instead of one
#     per package. Fewer, larger, cheaper to review, and each costs one CI
#     run rather than five.
#
#   * `open-pull-requests-limit` is the backstop. Raising it without
#     grouping would only mean drowning more slowly.
#
# The `ignore` entries are deliberate and temporary. Each holds a version
# bump that is a product decision rather than a maintenance chore, so it
# cannot silently re-occupy a slot. Remove the entry when its decision is
# made; do not leave them to rot.

version: 2

updates:
  # ── Rust (Cargo) ────────────────────────────────────────────────────────
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: deps
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # ── Node, repository root ───────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: deps
    groups:
      npm-root-minor-patch:
        update-types:
          - minor
          - patch

  # ── Node, SvelteKit frontend ────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: deps
    groups:
      ui-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Majors deferred as decisions, not chores. None of these four reaches
      # a user: they are build and test tooling. Each needs its own ticket
      # and its own timebox, and none should hold a Dependabot slot while it
      # waits.
      #
      # tailwindcss 4 replaces the config file with CSS-native config: a UI
      # migration with no advisory behind it.
      #
      # vite 8, vitest 4 and vite-plugin-svelte 7 share a dependency graph
      # and move together or not at all. vitest 4 is the documented fix for
      # the one critical advisory in the frontend chain, so this ignore is
      # the entry most worth removing soon.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sveltejs/vite-plugin-svelte"
        update-types: ["version-update:semver-major"]

  # ── Python, ML sidecar ──────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /sidecar
    schedule:
      interval: weekly
      day: monday
    # 15, not 10, from 8 September 2026. Five held pull requests (#1 opencv
    # 5.0.0.93, #4 scipy 1.18.1, #5 scikit-learn 1.9.0, #9 numpy 2.5.2,
    # #10 pillow-avif-plugin 1.6.0) sat in this queue while the drift test
    # ran, and the queue reached 9 of 10 with four other bumps still waiting.
    #
    # The test is done: docs/calibration/numerical-stack-drift-sep2026.md
    # (PR #37). Four pass with no detector output changed on 84 golden
    # images. scikit-learn 1.9.0 is blocked for a different reason: the
    # shipped GBM (deepfake_classifier.joblib) cannot be unpickled under it
    # and the load failure was silent. Paul's decision, 8 September: all
    # five are deferred to after the v1.1.0 release on 13 November 2026, then
    # taken as one combined bump (numpy, scipy, opencv, pillow-avif) plus a
    # separate model re-serialisation PR for scikit-learn.
    #
    # The five are NOT added to `ignore` below, on purpose. The docs are
    # explicit that ignore applies "when it opens pull requests for version
    # updates and security updates", and there is no ignore parameter that
    # excludes security updates: `update-types` and `versions` both filter
    # the security path as well. An ignore on numpy's minors would mute a
    # fix that ships in 2.5.x. The Pillow lesson further down applies to
    # all five, and to pillow-avif-plugin and opencv most of all, because
    # they decode files supplied by whoever the user is investigating.
    #
    # Instead: the five are closed by hand (#1 already is). Closing a
    # Dependabot pull request stops it recreating that exact version, and
    # nothing later; the next numpy or scipy release will open a fresh pull
    # request and take a slot again. The raised limit is headroom for that
    # churn so the other pip bumps are not starved until November. It does
    # not touch security updates either way; they are exempt from the cap.
    #
    # One residual, stated rather than buried: closing a pull request stores
    # an exact-version ignore condition, and those apply to security updates
    # too. If an advisory's minimum fixed version were exactly 2.5.2, 1.18.1,
    # 1.9.0, 5.0.0.93 or 1.6.0, reopening the closed pull request clears it.
    #
    # REMOVE this override (back to 10) after the v1.1.0 release, 13 November
    # 2026, once the combined bump has landed and the queue has been cleared.
    open-pull-requests-limit: 15
    labels:
      - dependencies
      - python
    commit-message:
      prefix: deps
    groups:
      pip-patch:
        update-types:
          - patch
    ignore:
      # FastAPI is pre-1.0, so its minors carry the breaking changes a major
      # would elsewhere. Twenty minors behind deserves a deliberate
      # regression pass, scheduled for the November release, rather than a
      # weekly bump. Patches still come through.
      - dependency-name: fastapi
        update-types: ["version-update:semver-minor"]
      # numpy, scipy, scikit-learn, opencv-python-headless and
      # pillow-avif-plugin are NOT ignored either, despite being deferred
      # until after 13 November 2026. See the `open-pull-requests-limit`
      # comment above for why: an ignore entry would mute their security
      # updates for the whole deferral.
      # Pillow is NOT ignored, and an earlier version of this file got that
      # wrong. It was held here pending a decode-drift test, on the reasoning
      # that every forensic feature starts from PIL-decoded pixels and the
      # detector thresholds are calibrated against the current decoder.
      #
      # The 4 September supply-chain audit inverted that. Pillow 11.2.1
      # carries heap out-of-bounds writes reachable from Image.paste() and
      # crop() (CVE-2026-59199) and from ImageCms (CVE-2026-59205), in code
      # paths content_type.py and clip_detector.py run on files supplied by
      # whoever the user is investigating. The fixes exist only in 12.x.
      #
      # Dependabot ignore rules suppress security updates as well as version
      # updates, so leaving the rule here would have muted the alert for the
      # most reachable vulnerability in the sidecar. The drift test still
      # runs, but it now decides whether to RECALIBRATE, not whether to
      # take the fix.

  # ── GitHub Actions ──────────────────────────────────────────────────────
  # This ecosystem was saturated too. Grouping matters most here, because
  # action bumps are near-identical in risk and reviewing five separate pull
  # requests for them is pure overhead.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
