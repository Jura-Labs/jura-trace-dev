name: CI

on:
  # Deliberately NOT filtered to `branches: [main]`. That filter meant a pull
  # request opened against any other base got no CI at all, and an absent run
  # reads as "not yet verified" rather than as a failure, which is the more
  # dangerous of the two. Found 8 September 2026 when a stacked PR (#29, based
  # on #28) sat with no checks until one was dispatched by hand.
  pull_request:
  # Work that lands directly on main must be tested too. Without this, the
  # gate only watches the path nobody used for the June v1.0.0 release: all
  # eleven of those commits went straight to main and CI never saw them.
  push:
    branches: [main]
  workflow_dispatch:  # manual trigger from Actions tab when needed

# Cancel redundant runs on the same branch or PR to save CI minutes, but never
# on main, where every push gets its own concurrency group and therefore its
# own verdict.
#
# Cancelling is right for a branch someone is still pushing to, where only the
# newest commit matters. It is wrong for main, where every commit is a state
# the project was actually in. On 8 September 2026 four merges landed within
# fourteen minutes and each new run cancelled the one before it, so main went
# from the repository cutover to that evening without a single successful CI
# run (one run had completed, and failed on the audit gate; an earlier version
# of this comment said "completed", which overstated it). Three of the
# cancellations showed a red X against `cargo test`, which was the
# cancellation rather than a failure, so the setting also manufactured false
# evidence of breakage.
#
# The first fix, later the same day, set cancel-in-progress to false on main.
# That was not enough, and the reason is in GitHub's own documentation: "By
# default, only one job or workflow run can be pending in a concurrency group
# at a time", and "any existing pending job or workflow in the same group is
# canceled and replaced." cancel-in-progress protects the RUNNING run only.
# When four merges landed within eight seconds at 21:44 UTC, the first ran,
# the last queued, and the two in between (runs 34282224860 for 9a177fd5 and
# 34282231338 for 3ca2896f) were cancelled before starting a single job. Two
# commits on main have no CI verdict as a result.
#
# So on main the group is keyed on the commit SHA instead of the ref. No two
# pushes share a group, nothing is ever pending behind anything, and every
# commit runs to a verdict. Public-repo minutes are free, so the parallelism
# costs nothing. GitHub also offers `queue: max` for this, but the docs say it
# cannot be combined with cancel-in-progress: true, and this block sets that
# key by expression, so the per-SHA group is the unambiguous choice.
#
# The push trigger above exists precisely so main is never unverified. Both
# earlier settings quietly reopened that hole whenever merges arrived in a
# burst, which is what a release day looks like.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Rust: check, clippy, fmt, test ──────────────────────────────────────────
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Tauri v2 requires these GTK/WebKit packages on Linux.
      # libayatana-appindicator3-dev covers the system-tray feature.
      # libsoup-3.0-dev is required by webkit2gtk 4.1.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      # Pin to the exact minimum Rust version declared in Cargo.toml (rust-version = "1.88").
      # Using dtolnay/rust-toolchain rather than actions-rs because it is actively maintained.
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09
        with:
          toolchain: "1.88"
          components: clippy, rustfmt

      # Cache Cargo registry and build artefacts keyed on Cargo.lock.
      # restore-keys provides a partial-match fallback so cold builds are
      # faster than a fully cold start after any dependency change.
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # The Tauri build macro (tauri::generate_context!) embeds the frontend
      # dist path at compile time. Build the frontend first so cargo check /
      # cargo test do not fail with a "missing frontendDist" error.
      - name: Setup Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build frontend (required by tauri::generate_context!)
        run: cd ui && npm ci && npm run build

      # tauri.conf.json lists "sidecar-bundle/**/*" in bundle.resources. That
      # directory is the PyInstaller --onedir output: 529 MB, gitignored, and
      # absent from a fresh checkout. Tauri's build script treats a resource
      # glob matching nothing as a hard error:
      #
      #   glob pattern sidecar-bundle/**/* path not found or didn't match any files
      #
      # so `cargo check` fails before compiling a single line of our code.
      #
      # This has been broken since 16 May 2026, when commit 72d8e42 (JTV-184)
      # added that resource. CI last ran on 30 April, before it landed, so
      # the Rust job has been incapable of passing for three and a half
      # months and nothing said so. It surfaced on the first run after the
      # gate was repaired.
      #
      # A placeholder is the right fix for THIS job. Nothing here bundles or
      # ships: we type-check, lint and test. Building the real 529 MB sidecar
      # to satisfy a glob would cost many minutes per run to produce an
      # artefact the job then throws away. The release workflow builds the
      # genuine bundle, and its own verification gate checks the contents.
      - name: Placeholder for the sidecar bundle resource glob
        run: |
          mkdir -p src-tauri/sidecar-bundle
          cat > src-tauri/sidecar-bundle/.ci-placeholder <<'EOF'
          Placeholder so tauri.conf.json's "sidecar-bundle/**/*" resource glob
          matches during CI type-checking. The real bundle is built by the
          release workflow. See the comment in .github/workflows/ci.yml.
          EOF

      - name: cargo check
        run: cd src-tauri && cargo check

      - name: cargo clippy
        run: cd src-tauri && cargo clippy -- -D warnings

      - name: cargo fmt
        run: cd src-tauri && cargo fmt --check

      - name: cargo test
        run: cd src-tauri && cargo test

      # Audit Rust dependencies against the RustSec advisory database.
      # Companion to pip-audit in the python job and the cross-ecosystem
      # OSV-Scanner workflow. Defence in depth: native scanners often pick
      # up advisories that haven't yet landed in OSV.dev and vice versa.
      #
      # The `|| true` that used to sit on the install line was worse than
      # useless: it swallowed an install failure, and then `cargo audit` on
      # the next line failed anyway with an unhelpful "no such command".
      # A failure here should say what actually failed.
      #
      # The install is skipped when the Cache Cargo step above has already
      # restored a cargo-audit binary into ~/.cargo/bin. That is not only a
      # cost saving (building it from source is about fifteen minutes of
      # billable time for a tool that does not change), it is a correctness
      # fix. `cargo install` refuses to overwrite an existing binary and
      # exits 101 with "binary `cargo-audit` already exists in destination".
      # On 8 September 2026 that put a red X on the cargo-audit step of
      # every open pull request and on main, with no advisory involved at
      # all, and it read exactly like a new vulnerability landing. The
      # mechanism: the cache key hashes Cargo.lock, so any lockfile change
      # misses the key, the restore-keys prefix falls back to the previous
      # cache, and that cache carries the binary the previous run built.
      # It would have recurred on every lockfile change after any green run.
      #
      # The version is printed so the log says which cargo-audit produced
      # the verdict. The advisory database is fetched fresh on every run
      # regardless of the binary's age, so a cached tool does not mean a
      # stale scan. Still no third-party install action: the supply chain
      # this workflow exists to watch stays as short as it was.
      - name: cargo-audit
        run: |
          if command -v cargo-audit >/dev/null 2>&1; then
            echo "cargo-audit restored from cache: $(cargo audit --version)"
          else
            cargo install --locked cargo-audit
            echo "cargo-audit built from source: $(cargo audit --version)"
          fi
          cd src-tauri && cargo audit

  # ── Frontend: svelte-check + vitest ─────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci

      # svelte-kit sync generates .svelte-kit/tsconfig.json referenced by
      # svelte-check — must run before the type check step.
      - name: svelte-check
        run: cd ui && npx svelte-kit sync && npx svelte-check

      # Vitest unit tests (vitest run = single-pass, non-interactive).
      - name: Run unit tests
        run: cd ui && npm test -- --run

      # ── Playwright e2e ────────────────────────────────────────────────────
      #
      # This used to say the e2e suite was "better suited to a dedicated
      # nightly workflow". That workflow was never written: the repository
      # has ci.yml, osv-scanner.yml and release.yml and nothing else. So 314
      # e2e assertions across 11 spec files ran nowhere at all, while the
      # pull-request template asked contributors to confirm they passed.
      #
      # They are cheap. The suite completes in under thirty seconds against a
      # plain Vite server, with no Rust build and no sidecar, which makes this
      # the least expensive coverage in the repository by a wide margin.
      #
      # --with-deps installs the system libraries the browser needs on a bare
      # runner; without it the launch fails with "Executable doesn't exist"
      # and every test reports as failed for a reason unrelated to the code.
      - name: Install Playwright browser
        run: cd ui && npx playwright install --with-deps chromium

      # The nine visual-regression tests (eighteen across the two projects)
      # are deselected rather than ignored, so they show as not-run instead
      # of silently passing.
      #
      # Every committed baseline is a *-darwin.png, because they were all
      # generated on a Mac. Playwright puts the platform in the snapshot
      # filename, so on an Ubuntu runner it looks for *-linux.png, finds
      # nothing, and fails. Deselecting is honest about that; passing
      # --ignore-snapshots would make the assertions succeed without
      # comparing anything, which is the failure mode this workflow exists to
      # prevent. Generating and committing Linux baselines is the fix and is
      # tracked in BL-TEST-003.
      - name: Run e2e tests (296 of 314; visual baselines are macOS-only)
        run: cd ui && npx playwright test --grep-invert "visual:"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7

  # ── Python: lint, format, pytest ─────────────────────────────────────────────
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Match the minimum Python version declared in the sidecar README/Cargo.
      # The sidecar uses Python 3.13 features; 3.12 is used here as the earliest
      # version available on ubuntu-latest GHA runners as of 2026-Q1.
      # Update to 3.13 once ubuntu-latest ships it by default.
      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # Cache pip downloads keyed on requirements.lock so repeated runs skip
      # the heavy ML library downloads (torch, opencv, etc.).
      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('sidecar/requirements.lock') }}
          restore-keys: pip-${{ runner.os }}-

      # Install ruff separately (fast, no heavy deps) so lint runs even if
      # the full sidecar dependency install fails.
      #
      # PINNED. This was `pip install ruff`, unpinned, and a ruff release
      # that tightened a rule turned the build red with no change to this
      # repository. That is what has kept the Python job failing since 30
      # April 2026: 35 of the 67 findings were E402, a rule about import
      # placement. The code did not break, the tool moved. Bump this
      # deliberately, with the findings fixed in the same commit.
      - name: Install ruff
        run: pip install ruff==0.14.2

      - name: Lint
        run: cd sidecar && ruff check .

      - name: Format check
        run: cd sidecar && ruff format --check .

      # Install from pinned lock file for reproducible builds.
      # Falls back to requirements.txt if lock file is absent.
      - name: Install sidecar dependencies
        run: |
          if [ -f sidecar/requirements.lock ]; then
            pip install -r sidecar/requirements.lock
          else
            pip install -r sidecar/requirements.txt
          fi

      # Tests run BEFORE the audit, deliberately.
      #
      # The first working run of this job, on PR #27, put pip-audit first
      # and it failed on sixteen Pillow advisories. That is pip-audit doing
      # its job, but the consequence was that pytest was skipped, so the
      # 435 sidecar tests reported nothing. With a two-month advisory
      # backlog to clear, that ordering would have kept the test suite dark
      # for as long as any advisory existed, which is exactly the failure
      # this whole branch is repairing.
      #
      # Both signals matter and neither should hide the other. Tests first
      # means a vulnerability finding never costs us the test result; the
      # job still goes red on advisories, so nothing is weakened.
      - name: Run pytest
        run: cd sidecar && python -m pytest tests/ -v

      # Audit installed packages for known CVEs. Audits the environment the
      # step above just built, so it sees exactly what the sidecar runs.
      #
      # PINNED, for the same reason ruff is: an unpinned linter or auditor
      # can turn the build red with no change to this repository, and that
      # is precisely how the Python job died in April.
      - name: pip-audit
        run: pip install pip-audit==2.10.1 && pip-audit

  # ── Repo hygiene: fail build if stray model backup files are committed ─────
  # Rationale: unverified .joblib backups in models/ are a supply-chain risk —
  # the production model file carries a hardcoded SHA-256 integrity check, but
  # a .backup file sitting beside it has no such check and could be renamed by
  # any local process to shadow the production model (pickle EoP vector).
  # Flagged by the security-auditor cross-review on 2026-04-07; this guard
  # prevents regression.
  repo-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Broadened 4 September 2026. As written, this guard would not have
      # caught the real stray file, on two counts:
      #
      #   1. It searched `models/` only. The directory that is bundled into
      #      the application is `src-tauri/models/`, which it never looked at.
      #   2. The glob `*.bak` requires the name to END in ".bak". The actual
      #      file is `deepfake_classifier.joblib.bak-1.7.2`, so even pointed
      #      at the right directory it would have passed.
      #
      # Both verified by running the original find against the live tree.
      #
      # NOTE ON WHAT THIS CAN AND CANNOT DO. CI only ever sees tracked
      # files, and that stray is untracked, so no CI guard can catch it. It
      # ships because macOS releases are built locally from the working
      # tree. The guard that matters for the bundle is the pre-flight check
      # in scripts/build-local-mac.sh; this one stops a stray being
      # committed, which is the narrower thing it was written for.
      - name: Forbid model backup files
        run: |
          set -e
          matches=$(find models src-tauri/models -type f \
            \( -name '*.bak*' -o -name '*.backup*' -o -name '*.old' \
               -o -name '*.orig' -o -name '*~' \) 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "ERROR: stray model files found. These carry no SHA-256 integrity"
            echo "check and must not be committed: a file sitting beside the"
            echo "production model can be renamed to shadow it."
            echo "Offending files:"
            echo "$matches"
            echo ""
            echo "Remove them with: git rm <path>"
            exit 1
          fi
          echo "OK — no stray model files in models/ or src-tauri/models/."

      # ── Action pinning guard ────────────────────────────────────────────────
      # Every `uses:` must name a 40-character commit SHA, not a tag.
      #
      # A tag is mutable. `tauri-apps/tauri-action@v0` is a moving major-zero
      # tag on the action that builds and signs the release artefacts with the
      # Apple and Azure certificates: whoever controls that tag controls what
      # gets signed, and no CVE will ever make that visible.
      #
      # This guard exists because pinning does not stay done. The pins were
      # written against one revision of the workflows, and by the time they
      # were ready to merge, main had added an unpinned
      # `actions/upload-artifact@v4` in osv-scanner.yml. One drift in a single
      # pull request is enough to show the discipline needs a check rather
      # than an intention.
      - name: Every GitHub Action is pinned to a commit SHA
        run: |
          set -euo pipefail
          unpinned=$(grep -rnE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*[A-Za-z]' .github/workflows/ \
            | grep -vE '@[0-9a-f]{40}' || true)
          if [ -n "$unpinned" ]; then
            echo "::error::Unpinned GitHub Action(s). Pin to a full commit SHA with the version in a trailing comment."
            echo "$unpinned"
            echo ""
            echo "Resolve a SHA with:"
            echo "  gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha"
            exit 1
          fi
          echo "OK — every action is pinned to a commit SHA."

      # ── requirements-ci.txt sync guard ──────────────────────────────────────
      # Fails if any package present in sidecar/requirements.txt is absent from
      # sidecar/requirements-ci.txt. Catches the class of drift that caused
      # onnxruntime (and regex) to be missing from CI sidecar builds (JTV-143,
      # 3 May 2026), making clip_detect silently false on Windows/Linux installs.
      # The guard runs without installing any extra packages (stdlib only).
      - name: Check requirements-ci.txt is in sync with requirements.txt
        run: python3 scripts/check_requirements_sync.py
