name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:  # manual trigger from Actions tab when needed

# Cancel redundant workflow runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Rust: check, clippy, fmt, test ──────────────────────────────────────────
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 requires these GTK/WebKit packages on Linux.
      # libayatana-appindicator3-dev covers the system-tray feature.
      # libsoup-3.0-dev is required by webkit2gtk 4.1.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      # Pin to the exact minimum Rust version declared in Cargo.toml (rust-version = "1.88").
      # Using dtolnay/rust-toolchain rather than actions-rs because it is actively maintained.
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: clippy, rustfmt

      # Cache Cargo registry and build artefacts keyed on Cargo.lock.
      # restore-keys provides a partial-match fallback so cold builds are
      # faster than a fully cold start after any dependency change.
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # The Tauri build macro (tauri::generate_context!) embeds the frontend
      # dist path at compile time. Build the frontend first so cargo check /
      # cargo test do not fail with a "missing frontendDist" error.
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build frontend (required by tauri::generate_context!)
        run: cd ui && npm ci && npm run build

      - name: cargo check
        run: cd src-tauri && cargo check

      - name: cargo clippy
        run: cd src-tauri && cargo clippy -- -D warnings

      - name: cargo fmt
        run: cd src-tauri && cargo fmt --check

      - name: cargo test
        run: cd src-tauri && cargo test

  # ── Frontend: svelte-check + vitest ─────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci

      # svelte-kit sync generates .svelte-kit/tsconfig.json referenced by
      # svelte-check — must run before the type check step.
      - name: svelte-check
        run: cd ui && npx svelte-kit sync && npx svelte-check

      # Vitest unit tests (vitest run = single-pass, non-interactive).
      # Playwright e2e tests are skipped here — they require a running dev
      # server and are better suited to a dedicated nightly workflow.
      - name: Run unit tests
        run: cd ui && npm test -- --run

  # ── Python: lint, format, pytest ─────────────────────────────────────────────
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Match the minimum Python version declared in the sidecar README/Cargo.
      # The sidecar uses Python 3.13 features; 3.12 is used here as the earliest
      # version available on ubuntu-latest GHA runners as of 2026-Q1.
      # Update to 3.13 once ubuntu-latest ships it by default.
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cache pip downloads keyed on requirements.lock so repeated runs skip
      # the heavy ML library downloads (torch, opencv, etc.).
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('sidecar/requirements.lock') }}
          restore-keys: pip-${{ runner.os }}-

      # Install ruff separately (fast, no heavy deps) so lint runs even if
      # the full sidecar dependency install fails.
      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: cd sidecar && ruff check .

      - name: Format check
        run: cd sidecar && ruff format --check .

      # Install from pinned lock file for reproducible builds.
      # Falls back to requirements.txt if lock file is absent.
      - name: Install sidecar dependencies
        run: |
          if [ -f sidecar/requirements.lock ]; then
            pip install -r sidecar/requirements.lock
          else
            pip install -r sidecar/requirements.txt
          fi

      # Audit installed packages for known CVEs.
      - name: pip-audit
        run: pip install pip-audit && pip-audit

      - name: Run pytest
        run: cd sidecar && python -m pytest tests/ -v

  # ── Repo hygiene: fail build if stray model backup files are committed ─────
  # Rationale: unverified .joblib backups in models/ are a supply-chain risk —
  # the production model file carries a hardcoded SHA-256 integrity check, but
  # a .backup file sitting beside it has no such check and could be renamed by
  # any local process to shadow the production model (pickle EoP vector).
  # Flagged by the security-auditor cross-review on 2026-04-07; this guard
  # prevents regression.
  repo-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Forbid model backup files
        run: |
          set -e
          matches=$(find models -type f \( -name '*.backup' -o -name '*.bak' -o -name '*.joblib.old' \) 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "ERROR: model backup files found in models/ — these are unverified and must not be committed."
            echo "Offending files:"
            echo "$matches"
            echo ""
            echo "Remove them with: git rm <path>"
            exit 1
          fi
          echo "OK — no stray model backup files."
