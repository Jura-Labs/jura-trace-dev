name: Updater live leg (Windows)

# The release gate's single non-negotiable, for Windows. A pristine, publicly
# downloaded v1.0.0 asks the REAL update service for a manifest and says what
# it decided. Nothing here is staged: no hosts entry, no throwaway certificate
# authority, no local listener. The app talks to juralabs.org over the public
# internet and the manifest is whatever the Cloudflare worker is serving.
#
# ── Why this exists as a separate workflow ─────────────────────────────────
#
# `updater-e2e.yml` is the STAGING leg. It serves a manifest it composed
# itself, over a certificate it minted itself, through a hosts redirect, so it
# can advertise any version it likes and prove the client's behaviour without
# a release existing. That file took several attempts to get right and it is
# the thing that catches a regression on every change. Threading a "talk to
# production instead" mode through its three hundred lines of PowerShell would
# put the proven path at risk to save duplicating sixty lines of debugging
# plumbing. Those sixty lines are copied verbatim below and marked, so a fix
# to one is an obvious fix to the other.
#
# ── What this proves that staging cannot ───────────────────────────────────
#
# PROVES: the shipped binary resolves the real hostname through public DNS,
# trusts the real certificate chain with no help from this runner, fetches
# the manifest the worker actually serves, verifies its signature against the
# key compiled into v1.0.0, and decides that the published version is newer.
# Every one of those is a thing staging deliberately substitutes.
#
# What it asserts is the app's own version, before and after. The sentence
# "Version X is available" appears only while the download is in flight, and
# run 34570877379 pressed the button, updated itself, and failed anyway
# because the sentence had gone by the next probe. A version that changed
# from 1.0.0 to 1.1.0 is durable evidence and proves the install, not the
# offer.
#
# It presses the button rather than waiting, because v1.0.0 has NO startup
# update check. That arrived in v1.1.0 as T1.2, and `git show
# v1.0.0:ui/src/lib/updater.ts` contains no reference to it. The first attempt
# at this file waited for a check that version cannot perform and read an
# empty record of the app's last check, which is what that means. It is also
# a fact about the release worth stating plainly: no existing user is told
# that v1.1.0 exists unless they open Settings and ask.
#
# Pressing the button in v1.0.0 begins the download and install at once, so
# this run also attempts the install rather than only being offered it. The
# assertion is still the verdict sentence, because that is what appears
# immediately and stays for the minutes the transfer takes.
#
# ── The claim that it is live is asserted, not assumed ─────────────────────
#
# A test that says "production" while quietly talking to a local listener is
# the exact failure this repository has spent a fortnight removing. So before
# the app is launched, this workflow asserts that juralabs.org resolves to a
# public address, that the hosts file names it nowhere, and that no extra
# root certificate has been installed on the machine. If any of those is
# false the run fails before it can produce a reassuring green tick.

on:
  workflow_dispatch:
    inputs:
      previous_tag:
        description: "Tag whose installer is treated as the PREVIOUS version. The published v1.0.0 unless you are testing something else."
        required: false
        default: "v1.0.0"
        type: string
      expected_version:
        description: "Version the live service is expected to offer. The run fails unless the app says this exact version is available."
        required: false
        default: "1.1.0"
        type: string

concurrency:
  group: updater-live-leg-${{ github.event.inputs.previous_tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows, live, from ${{ github.event.inputs.previous_tag }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the previous version's installer
        shell: bash
        env:
          # RELEASE_PAT rather than github.token: the installers live on
          # Jura-Labs/jura-trace and github.token is scoped to this repo.
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          PREV: ${{ github.event.inputs.previous_tag || 'v1.0.0' }}
        run: |
          set -euo pipefail
          mkdir -p prev
          gh release download "$PREV" --repo Jura-Labs/jura-trace \
            --pattern "*Windows-x64.msi" --dir prev
          ls -lh prev/ | sed 's/^/  /'

      - name: Assert this machine is not staging anything
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $fail = $false

          # 1. The hosts file must not mention the host at all.
          $hosts = Get-Content "$env:SystemRoot\System32\drivers\etc\hosts" -Raw
          if ($hosts -match "juralabs") {
            Write-Host "::error::The hosts file mentions juralabs. This runner is not clean."
            $fail = $true
          } else {
            Write-Host "OK: hosts file does not mention juralabs."
          }

          # 2. The name must resolve to a public address.
          $addrs = (Resolve-DnsName juralabs.org -Type A -ErrorAction Stop).IPAddress
          Write-Host "juralabs.org resolves to: $($addrs -join ', ')"
          foreach ($a in $addrs) {
            if ($a -like "127.*" -or $a -like "10.*" -or $a -like "192.168.*" -or $a -like "169.254.*") {
              Write-Host "::error::juralabs.org resolves to a private address ($a)."
              $fail = $true
            }
          }
          if (-not $fail) { Write-Host "OK: every address is public." }

          # 3. No root certificate of OURS is installed.
          #
          #    The first version of this matched "jura|throwaway|test" and
          #    failed on the very first run, because the windows-latest image
          #    ships four vendor testing roots of its own: Microsoft Testing
          #    Root Certificate Authority 2010, Microsoft Test Root Authority,
          #    Microsoft ECC Testing Root 2017, and UniTrust Global TLS MLDSA
          #    Root R1 TEST. None of them can impersonate juralabs.org and the
          #    word "test" in a vendor root is not evidence of anything. The
          #    pattern is now "jura", which is the only thing the staging leg
          #    installs and the only thing specific to us.
          $roots = (Get-ChildItem Cert:\LocalMachine\Root).Count
          Write-Host "machine root certificates present: $roots"
          $suspect = Get-ChildItem Cert:\LocalMachine\Root | Where-Object { $_.Subject -match "jura" }
          if ($suspect) {
            Write-Host "::error::A root certificate mentioning jura is installed on this machine:"
            $suspect | Format-Table Subject, Thumbprint -AutoSize | Out-String | Write-Host
            $fail = $true
          } else {
            Write-Host "OK: no jura root certificate on this machine."
          }

          # 4. The positive assertion, and the one that actually matters.
          #
          #    Enumerating what is installed is weak evidence twice over: it
          #    is fragile against vendor images, as branch 3 learned, and it
          #    says nothing about the chain the app will really be offered.
          #    So fetch the manifest exactly as the app will, and look at the
          #    certificate the server presented and the document it returned.
          #    If this runner were being lied to, this is where it would show.
          $req = [System.Net.HttpWebRequest]::Create("https://juralabs.org/api/updates/latest.json")
          $req.UserAgent = "jura-trace-live-leg-precheck"
          $resp = $req.GetResponse()
          $reader = New-Object System.IO.StreamReader($resp.GetResponseStream())
          $body = $reader.ReadToEnd()
          $reader.Close(); $resp.Close()
          $cert = $req.ServicePoint.Certificate
          Write-Host "server certificate subject: $($cert.Subject)"
          Write-Host "server certificate issuer : $($cert.Issuer)"
          if ($cert.Issuer -match "jura|throwaway") {
            Write-Host "::error::The certificate presented for juralabs.org was issued by us."
            $fail = $true
          } else {
            Write-Host "OK: the certificate was issued by a public authority, not by this test."
          }
          $m = $body | ConvertFrom-Json
          $platforms = @($m.platforms.PSObject.Properties.Name | Sort-Object)
          Write-Host "live manifest version   : $($m.version)"
          Write-Host "live manifest platforms : $($platforms -join ', ')"
          if ($platforms -notcontains "windows-x86_64") {
            Write-Host "::error::The live manifest has no windows-x86_64 entry, so there is nothing for this client to be offered."
            $fail = $true
          } else {
            Write-Host "OK: the live manifest carries a windows-x86_64 entry."
          }
          $winSig = $m.platforms."windows-x86_64".signature
          if ($winSig -notmatch "^dW50cnVzdGVk") {
            Write-Host "::error::The windows-x86_64 signature field does not contain a minisign signature. First 40 characters: $($winSig.Substring(0, [Math]::Min(40, $winSig.Length)))"
            Write-Host "That is BL-REL-002, and it would mean this release cannot be installed by anyone."
            $fail = $true
          } else {
            Write-Host "OK: the windows-x86_64 signature is a minisign signature, not a URL."
          }

          if ($fail) {
            Write-Host "Refusing to continue. A live leg that is not live proves nothing."
            exit 1
          }

      - name: Install the previous version, launch it, and read its verdict
        shell: pwsh
        env:
          EXPECTED: ${{ github.event.inputs.expected_version || '1.1.0' }}
          PREV: ${{ github.event.inputs.previous_tag || 'v1.0.0' }}
        run: |
          $ErrorActionPreference = "Stop"

          function Get-CdpTargets {
            try {
              return Invoke-RestMethod -Uri "http://127.0.0.1:9222/json/list" -TimeoutSec 3
            } catch {
              return $null
            }
          }

          function Invoke-CdpEvaluate {
            param([string]$WsUrl, [string]$Expression)
            $ws = New-Object System.Net.WebSockets.ClientWebSocket
            try {
              $cts = [System.Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds(10))
              $ws.ConnectAsync([Uri]$WsUrl, $cts.Token).GetAwaiter().GetResult()
              $req = @{
                id = 1
                method = "Runtime.evaluate"
                params = @{ expression = $Expression; returnByValue = $true; awaitPromise = $false }
              } | ConvertTo-Json -Depth 6 -Compress
              $out = [ArraySegment[byte]]::new([Text.Encoding]::UTF8.GetBytes($req))
              $ws.SendAsync($out, [System.Net.WebSockets.WebSocketMessageType]::Text, $true, $cts.Token).GetAwaiter().GetResult()

              $buf = New-Object byte[] 65536
              # The target may push protocol events we did not ask for, so read
              # until the reply carrying our id arrives or the budget runs out.
              for ($i = 0; $i -lt 40; $i++) {
                $sb = New-Object System.Text.StringBuilder
                do {
                  $seg = [ArraySegment[byte]]::new($buf)
                  $res = $ws.ReceiveAsync($seg, $cts.Token).GetAwaiter().GetResult()
                  [void]$sb.Append([Text.Encoding]::UTF8.GetString($buf, 0, $res.Count))
                } while (-not $res.EndOfMessage)
                $msg = $sb.ToString() | ConvertFrom-Json
                if ($msg.id -eq 1) { return $msg }
              }
              return $null
            } catch {
              return $null
            } finally {
              try { $ws.Dispose() } catch { }
            }
          }

          # The probe. textContent rather than innerText, so a banner sitting
          # behind the first-run onboarding overlay is still read; innerText
          # would drop anything the layout engine considers hidden. The last
          # startup-check timestamp comes back too: it is written only after
          # the plugin's check resolves, so it separates "the check threw" from
          # "the check completed and said something other than available".
          # The probe drives the app as a user would, because v1.0.0 cannot be
          # observed passively: it has NO startup update check. That arrived in
          # v1.1.0 as T1.2, and `git show v1.0.0:ui/src/lib/updater.ts` contains
          # no reference to it. The first attempt at this workflow waited for a
          # check that version cannot perform, and the app's own record of its
          # last check came back empty, which is exactly what that means.
          #
          # So: navigate to Settings, find the button by its label, press it
          # once, then watch. It is idempotent, because Runtime.evaluate is
          # called repeatedly against the same page and a second press would
          # restart the download.
          #
          # This is also why the run proves more than the macOS leg did.
          # Pressing that button in v1.0.0 begins the download and install
          # immediately; the status sentence appears at once and stays for the
          # minutes the transfer takes, so the verdict is easy to catch and the
          # install is genuinely attempted rather than merely offered.
          $probeJs = @(
            '(function () {',
            '  var EXPECTED = "' + $env:EXPECTED + '";',
            '  try {',
            '    var text = (document.body ? document.body.textContent : "").replace(/\s+/g, " ").trim();',
            '    if (location.pathname.indexOf("settings") === -1) {',
            '      location.href = "/settings";',
            '      return JSON.stringify({ stage: "navigating", url: location.href, ready: document.readyState, text: text.slice(0, 4000) });',
            '    }',
            '    var btns = Array.prototype.slice.call(document.querySelectorAll("button"));',
            '    var b = null;',
            '    for (var i = 0; i < btns.length; i++) {',
            '      if (/Check for Updates/i.test(btns[i].textContent || "")) { b = btns[i]; break; }',
            '    }',
            '    var vm = text.match(/About\s+Version\s+([0-9][0-9A-Za-z.\-+]*)/);',
            '    var appVersion = vm ? vm[1] : null;',
            '    var already = appVersion === EXPECTED;',
            '    if (b && !window.__juraClicked && !already) {',
            '      window.__juraClicked = true;',
            '      b.click();',
            '      return JSON.stringify({ stage: "clicked", appVersion: appVersion, url: location.href, ready: document.readyState, text: text.slice(0, 60000) });',
            '    }',
            '    return JSON.stringify({ stage: (already ? "updated" : (window.__juraClicked ? "watching" : "waiting-for-button")), appVersion: appVersion, hasButton: !!b, url: location.href, ready: document.readyState, text: text.slice(0, 60000) });',
            '  } catch (e) {',
            '    return JSON.stringify({ stage: "error", message: String(e) });',
            '  }',
            '})()'
          ) -join "`n"
          # ── install and launch, exactly as a user would ──────────────────
          $msi = (Get-ChildItem prev/*Windows-x64.msi | Select-Object -First 1).FullName
          Write-Host "installing $(Split-Path $msi -Leaf)"
          $p = Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/qn","/norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "install failed: $($p.ExitCode)" }
          $exe = Get-ChildItem -Path "$env:LOCALAPPDATA","$env:ProgramFiles" -Filter "jura-trace.exe" -Recurse -Depth 4 -ErrorAction SilentlyContinue |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "installed executable not found" }
          Write-Host "installed: $exe"

          # WebView2 ignores every per-user override for an elevated host, and
          # Actions steps run elevated, so the machine policy is the only way
          # to open the debugging port. See updater-e2e.yml for the full note.
          $browserArgs = "--remote-debugging-port=9222 --remote-allow-origins=*"
          $policyKey = "HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments"
          New-Item -Path $policyKey -Force | Out-Null
          New-ItemProperty -Path $policyKey -Name "jura-trace.exe" -Value $browserArgs -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $policyKey -Name "*" -Value $browserArgs -PropertyType String -Force | Out-Null
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = $browserArgs
          Start-Process -FilePath $exe

          # ── observe ──────────────────────────────────────────────────────
          $cdpUp = $false          # the debugging port answered
          $domRead = $false        # a page returned a non-empty document
          $clicked = $false        # the Check for Updates button was pressed
          $verdict = $null         # the transient sentence, if it was caught
          $versionBefore = $null   # what the app called itself before the press
          $versionAfter = $null    # what it calls itself now
          $lastProbe = $null
          $phrase = "Version $env:EXPECTED is available"
          $pattern = "Version " + [regex]::Escape($env:EXPECTED) + " is available"
          # 240 seconds was too tight. In run 34570877379 the observation that
          # mattered landed at 224 seconds, and in 34571740653 nothing was
          # observed at all: the debugging port answered but no page target
          # ever appeared, so not a single probe ran. On a cold runner the app
          # has to start, unpack a 500 MB sidecar and render, and then the
          # download it is asked for has to finish. Ten minutes, and the loop
          # still breaks the moment the version moves.
          $deadline = (Get-Date).AddSeconds(600)
          $targetsLogged = $false

          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
            $targets = Get-CdpTargets
            if (-not $targets) { continue }
            $cdpUp = $true
            # Say what the port actually offered the first time round. Without
            # this, "the port answered but no page returned a document" is a
            # dead end: it cannot be told apart from a page that returned an
            # empty one, and run 34571740653 ended there with nothing to read.
            if (-not $targetsLogged) {
              $targetsLogged = $true
              Write-Host "  debugging port offered $(@($targets).Count) target(s):"
              foreach ($t in @($targets)) {
                Write-Host "    type=$($t.type) url=$($t.url)"
              }
            }
            foreach ($t in @($targets | Where-Object { $_.type -eq "page" -and $_.webSocketDebuggerUrl })) {
              $reply = Invoke-CdpEvaluate -WsUrl $t.webSocketDebuggerUrl -Expression $probeJs
              if (-not $reply -or -not $reply.result -or -not $reply.result.result) { continue }
              $raw = $reply.result.result.value
              if (-not $raw) { continue }
              $probe = $raw | ConvertFrom-Json
              if ($probe.appVersion) {
                if (-not $clicked -and -not $versionBefore) {
                  $versionBefore = $probe.appVersion
                  Write-Host "  the installed app calls itself $versionBefore"
                }
                if ($versionAfter -ne $probe.appVersion) {
                  $versionAfter = $probe.appVersion
                  Write-Host "  app version now: $versionAfter"
                }
              }
              if ($probe.stage -eq "clicked") {
                $clicked = $true
                Write-Host "  pressed Check for Updates on $($probe.url)"
              }
              if ($probe.text -and $probe.text.Length -gt 0) {
                $domRead = $true
                $lastProbe = $probe
                if ($probe.text -match $pattern) { $verdict = $Matches[0] }
              }
            }
            if ($versionAfter -eq $env:EXPECTED) { break }
          }

          $record = [ordered]@{
            expected = $env:EXPECTED
            debug_port_answered = $cdpUp
            dom_read = $domRead
            button_pressed = $clicked
            version_before = $versionBefore
            version_after = $versionAfter
            transient_sentence = $verdict
            page_url = $(if ($lastProbe) { $lastProbe.url } else { $null })
            document_ready = $(if ($lastProbe) { $lastProbe.ready } else { $null })
            last_stage = $(if ($lastProbe) { $lastProbe.stage } else { $null })
            document_text_excerpt = $(if ($lastProbe) { $lastProbe.text.Substring(0, [Math]::Min(4000, $lastProbe.text.Length)) } else { $null })
          }
          $record | ConvertTo-Json -Depth 4 | Set-Content verdict.log

          # Four failure branches with four different messages, because a run
          # that could not look at the app must never read like a run that
          # looked and found nothing.
          if (-not $cdpUp) {
            Write-Host "::error::The WebView2 debugging port never answered, so the client's verdict could not be read."
            Write-Host "This is a failure of the TEST, not evidence about the client."
            Get-NetTCPConnection -LocalPort 9222 -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Host
            exit 1
          }
          if (-not $domRead) {
            Write-Host "::error::The debugging port answered but no page returned a document, so nothing was observed."
            Write-Host "This is a failure of the TEST, not evidence about the client. The target list"
            Write-Host "printed above says whether a page was ever offered at all: no page target means"
            Write-Host "the window never opened, while a page that returned nothing means it opened and"
            Write-Host "did not render."
            Write-Host "── processes ──"
            Get-Process jura-trace, msedgewebview2 -ErrorAction SilentlyContinue | Select-Object Id, ProcessName, StartTime | Format-Table -AutoSize | Out-String | Write-Host
            exit 1
          }
          if (-not $clicked) {
            Write-Host "::error::Check for Updates was never pressed, so the client was never asked."
            Write-Host "This is a failure of the TEST, not evidence about the client. Either the"
            Write-Host "Settings route did not load, or no button carries that label in $env:PREV."
            Write-Host "Last stage the probe reported: $($record.last_stage)"
            Write-Host "── what the app was showing ──"
            Write-Host $record.document_text_excerpt
            exit 1
          }
          Write-Host "OK: Check for Updates was pressed on the installed $env:PREV."

          # The assertion is the app's own version, not the sentence.
          #
          # The first version of this waited for "Version 1.1.0 is available",
          # which v1.0.0 shows only while the download is in flight. Run
          # 34570877379 pressed the button, updated itself, and failed, because
          # by the time the probe next looked the sentence had gone and the app
          # was correctly saying it was up to date. The durable evidence was
          # sitting in the same capture: the About section had changed from
          # 1.0.0 to 1.1.0. The transient sentence is still recorded when it is
          # caught, but nothing depends on catching it.
          if ($versionBefore -and $versionBefore -eq $env:EXPECTED) {
            Write-Host "::error::The installed $env:PREV already called itself $env:EXPECTED before anything was pressed."
            Write-Host "This is a failure of the TEST: the wrong installer was fetched, so an update"
            Write-Host "from it would prove nothing."
            exit 1
          }
          if ($versionAfter -ne $env:EXPECTED) {
            Write-Host "::error::A pristine $env:PREV install was asked, and did not end up on $env:EXPECTED."
            Write-Host "It called itself $versionBefore before the press and $versionAfter after it."
            Write-Host "The button was pressed, so this is the client's answer rather than a gap in"
            Write-Host "the test. On the live service it means one of: the manifest did not reach it,"
            Write-Host "the signature did not verify against the key compiled into the shipped binary,"
            Write-Host "the version comparison refused the published version, or the install failed."
            if ($verdict) { Write-Host "The app did say: `"$verdict`", so it was offered and did not arrive." }
            Write-Host "── what the app was showing ──"
            Write-Host $record.document_text_excerpt
            exit 1
          }

          Write-Host "OK: a pristine $env:PREV install, talking to the live service over public DNS"
          Write-Host "    and the real certificate chain, fetched and installed $env:EXPECTED."
          Write-Host "    It called itself $versionBefore before the press and $versionAfter after it."
          if ($verdict) { Write-Host "    The sentence caught in flight: `"$verdict`"" }
          "$versionBefore -> $versionAfter" | Set-Content observed-verdict.txt

      - name: Stop the app
        if: always()
        shell: pwsh
        run: |
          Get-Process jura-trace, msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "stopped"

      - name: Summary
        if: always()
        shell: bash
        env:
          PREV: ${{ github.event.inputs.previous_tag || 'v1.0.0' }}
          EXPECTED: ${{ github.event.inputs.expected_version || '1.1.0' }}
        run: |
          {
            echo "## Updater live leg, Windows"
            echo ""
            echo "Installed \`$PREV\` and pointed it at the real update service."
            echo "No hosts entry, no throwaway certificate, no local listener."
            echo ""
            if [ -f observed-verdict.txt ]; then
              echo "**Verdict read from the running app:** \`$(cat observed-verdict.txt)\`"
            else
              echo "**No verdict was read.** See the step log for which of the four"
              echo "failure branches fired; two of them are failures of the test"
              echo "rather than evidence about the client."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: updater-live-leg-windows
          path: |
            verdict.log
            observed-verdict.txt
          if-no-files-found: ignore
          retention-days: 14
