# SPDX-License-Identifier: AGPL-3.0-or-later
#
# OSV-Scanner — supply-chain vulnerability scan across every lockfile in the
# repo (Rust Cargo.lock, npm package-lock.json, Python requirements*.txt).
# Runs on pull requests against main, on push to main, and on a weekly cron
# so newly disclosed advisories surface even when the codebase is quiet.
#
# Why this is in addition to pip-audit + cargo-audit (in ci.yml):
#   - pip-audit and cargo-audit each speak their own native ecosystem.
#   - OSV pulls from the full OSV.dev database (GHSA, RUSTSEC, PYSEC, NPM,
#     GO, Maven, Packagist, etc.) in one pass and posts a single SARIF
#     report into the Security tab.
#   - Defence in depth: any one feed could miss an advisory; running both
#     OSV and the native scanners gives us overlapping coverage.

name: OSV-Scanner

on:
  # Not filtered to `branches: [main]`, for the same reason as ci.yml: a pull
  # request against any other base would otherwise get no scan, and a missing
  # scan reads as a clean one. That is the failure this workflow already had
  # once, from a different cause, and the assertion below exists because of it.
  pull_request:
  push:
    branches: [main]
  schedule:
    # 03:17 UTC every Monday. Off-peak; avoids the on-the-hour stampede.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scan:
    name: Scan lockfiles
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow's, so the reads are repeated.
    permissions:
      contents: read
      actions: read
      security-events: write  # required to upload SARIF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # `--skip-git` was a v1 flag and osv-scanner v2's `scan source`
      # subcommand does not define it. The scanner exited on "flag provided
      # but not defined: -skip-git", printed its usage text, and wrote no
      # SARIF — so this workflow scanned NOTHING from at least 6 July to 4
      # September 2026 while appearing in the Actions list every Monday.
      # The `continue-on-error` below is what made that quiet: it is kept,
      # so a real advisory does not block a merge, but the assertion after
      # it now distinguishes "found nothing" from "did not run".
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            --format=sarif
            --output=osv-results.sarif
            ./
        continue-on-error: true

      # An absent SARIF has been reading as a clean result for two months.
      # Fail loudly instead. This is the check that would have caught the
      # flag change the day it broke.
      - name: Assert the scan actually produced results
        run: |
          if [ ! -s osv-results.sarif ]; then
            echo "::error::OSV-Scanner produced no SARIF file. The scan did not run."
            echo "A missing report is not a clean report. Check the scanner step's log"
            echo "above for a usage dump, which means an invalid flag was passed."
            exit 1
          fi
          echo "SARIF written: $(wc -c < osv-results.sarif) bytes."

      # jura-archive is private, so code scanning upload needs GitHub
      # Advanced Security. Where that is unavailable this step fails and the
      # results would be lost, so the SARIF is also kept as a build artefact
      # and can be read from there.
      - name: Upload SARIF to code-scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

      - name: Keep the SARIF as an artefact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-results
          path: osv-results.sarif
          if-no-files-found: warn
