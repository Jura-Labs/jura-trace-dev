name: Installer test

# BL-TEST-001. Every other test in this repository runs before the product
# exists: against the crate, against Python modules, against components, or
# against the SvelteKit dev server in a browser. Nothing installs an
# installer, launches the installed binary, or checks that what a user
# downloads works.
#
# Three defects shipped in v1.0.0 and survived for months because of that. The
# updater manifest carried signature-file URLs so every update was rejected;
# Linux vanished from the manifest when the AppImage build was dropped; and
# the sidecar reported version 0.9.0 while the app declared 1.0.0.
#
# This workflow is the beginning of the answer, not the whole of it. What it
# covers today is stated plainly in the job summary rather than implied by a
# green tick.
#
# ── Cost ───────────────────────────────────────────────────────────────────
# Deliberately NOT on push or pull_request. Windows bills at 2x on a private
# repository, and a release build there already costs 144 charged minutes. So
# this runs on a published release and on demand, and it installs a
# pre-built artefact rather than building anything.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (e.g. v1.0.0). Defaults to the latest release."
        required: false
        type: string

concurrency:
  group: installer-test-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-deb:
    name: Linux (deb)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The installers live in the PUBLIC releases repo, not this one. A PAT
      # is not needed to read them, but gh requires a token to be present.
      - name: Resolve the tag under test
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${EVENT_TAG:-}}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo Jura-Labs/jura-trace --json tagName --jq .tagName)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Testing $tag"

      - name: Download the .deb from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          asset="JuraTrace-${VERSION}-Linux-x86_64.deb"
          mkdir -p dl
          # An absent asset is a finding, not an infrastructure problem: it is
          # exactly how Linux silently vanished from the update manifest.
          if ! gh release download "$TAG" --repo Jura-Labs/jura-trace --pattern "$asset" --dir dl; then
            echo "::error::$asset is not attached to $TAG."
            echo "Assets actually present:"
            gh release view "$TAG" --repo Jura-Labs/jura-trace --json assets --jq '.assets[].name' | sed 's/^/  /'
            exit 1
          fi
          ls -lh "dl/$asset"

      # Read the version the package DECLARES before installing it. This is
      # the assertion that catches a build labelled with the wrong version,
      # which is the class of fault that let the sidecar ship as 0.9.0 while
      # the app called itself 1.0.0.
      - name: The package version matches the tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          deb="dl/JuraTrace-${VERSION}-Linux-x86_64.deb"
          declared=$(dpkg-deb -f "$deb" Version)
          echo "tag says      : $VERSION"
          echo "package says  : $declared"
          # Tauri strips any -rc.N suffix from the deb version, so compare on
          # the numeric core rather than demanding an exact string match.
          core="${VERSION%%-*}"
          if [ "${declared%%-*}" != "$core" ]; then
            echo "::error::Package version '$declared' does not match tag '$VERSION'."
            exit 1
          fi
          echo "OK"

      - name: Install Tauri runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-0 \
            libgtk-3-0 \
            libayatana-appindicator3-1 \
            librsvg2-2 \
            xvfb \
            imagemagick \
            curl

      - name: Install the package
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          deb="./dl/JuraTrace-${VERSION}-Linux-x86_64.deb"
          # Read the package name from the .deb rather than assuming Tauri's
          # derivation from productName. If the name ever changes, this
          # follows it instead of failing in a way that looks like a broken
          # install.
          pkg=$(dpkg-deb -f "$deb" Package)
          echo "package name: $pkg"
          echo "$pkg" > /tmp/pkgname
          sudo apt-get install -y "$deb"
          echo "── installed files ──"
          dpkg -L "$pkg" | grep -E 'bin/|\.desktop$' | sed 's/^/  /'
          echo "── dpkg version ──"
          dpkg -s "$pkg" | grep '^Version:'

      # Launch the installed binary, not a build output. The REST API on
      # 127.0.0.1:8300 starts by default (the `api` feature is in
      # Cargo.toml's default set) and GET /api/v1/health is the one
      # unauthenticated endpoint, so it can answer three questions at once:
      # did the binary start, does the Rust core run, and what version does
      # the RUNNING app believe it is.
      - name: Launch the installed app and probe it
        id: probe
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          pkg=$(cat /tmp/pkgname)
          # Match the application binary by name, not "the first executable".
          #
          # This package installs three: gen-detectors (a 459 KB build-time
          # tool), jura-sidecar, and jura-trace. dpkg lists them
          # alphabetically, so `head -1` picks gen-detectors, and the job
          # would then fail with "the installed app did not answer
          # /api/v1/health" — an error naming the wrong thing entirely.
          #
          # Found by running this against the real v1.0.0 .deb before
          # trusting it, which is the whole argument of BL-TEST-001.
          binary=$(dpkg -L "$pkg" | grep -xE "/usr/bin/${pkg}" | head -1)
          if [ -z "$binary" ]; then
            echo "::error::No executable named '$pkg' found in package '$pkg'."
            echo "Executables the package does install:"
            dpkg -L "$pkg" | grep '/usr/bin/' | sed 's/^/  /'
            exit 1
          fi
          echo "launching $binary"

          mkdir -p artefacts
          xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" \
            "$binary" > artefacts/app-stdout.log 2> artefacts/app-stderr.log &
          echo $! > /tmp/app.pid

          # Poll rather than sleep. A fixed sleep is the timing-dependent
          # pattern BL-TEST-002 was written about.
          health=""
          for i in $(seq 1 60); do
            if health=$(curl -fsS --max-time 3 http://127.0.0.1:8300/api/v1/health 2>/dev/null); then
              echo "health responded after ~${i}s"
              break
            fi
            sleep 1
          done

          if [ -z "$health" ]; then
            echo "::error::The installed app did not answer /api/v1/health within 60s."
            echo "── stderr ──"; tail -40 artefacts/app-stderr.log || true
            echo "── stdout ──"; tail -40 artefacts/app-stdout.log || true
            exit 1
          fi

          echo "$health" | tee artefacts/health.json
          echo ""

          reported=$(printf '%s' "$health" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          status=$(printf '%s' "$health" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          # Strict key, no fallback. HealthResponse is serde camelCase, and a
          # tolerant lookup would silently absorb a schema rename that ought
          # to be a visible break.
          sidecar=$(printf '%s' "$health" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sidecarAvailable"])')

          echo "status              : $status"
          echo "version (running)   : $reported"
          echo "version (tag)       : ${VERSION%%-*}"
          echo "sidecar available   : $sidecar"
          echo "sidecar=$sidecar" >> "$GITHUB_OUTPUT"

          [ "$status" = "ok" ] || { echo "::error::health status is '$status', expected 'ok'."; exit 1; }

          if [ "$reported" != "${VERSION%%-*}" ]; then
            echo "::error::The running app reports version '$reported' but the tag is '${VERSION%%-*}'."
            exit 1
          fi
          echo "OK: the installed app runs and agrees with the tag."

      # A screenshot is not an assertion, and is not treated as one. It is for
      # a human to glance at, which is how the C2PA panel's "Tool: [object
      # Object]" would have been caught.
      - name: Screenshot the running app
        if: always()
        continue-on-error: true
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x900x24 >/dev/null 2>&1 &
          sleep 2
          import -window root artefacts/screen.png 2>/dev/null || \
            echo "screenshot unavailable (headless capture is best-effort)"

      - name: Stop the app
        if: always()
        run: |
          [ -f /tmp/app.pid ] && kill "$(cat /tmp/app.pid)" 2>/dev/null || true
          [ -f /tmp/pkgname ] && pkill -f "$(cat /tmp/pkgname)" 2>/dev/null || true
          exit 0

      - name: Summary
        if: always()
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SIDECAR: ${{ steps.probe.outputs.sidecar }}
        run: |
          {
            echo "## Linux installer test — $TAG"
            echo ""
            echo "**Proved:** the .deb downloads, declares the tag's version, installs,"
            echo "launches, and the running app answers /api/v1/health with a version"
            echo "matching the tag."
            echo ""
            echo "Sidecar available at probe time: \`${SIDECAR:-unknown}\`. This is"
            echo "reported, not asserted: the sidecar starts asynchronously and a"
            echo "cold runner is not evidence about a user's machine."
            echo ""
            echo "**Not proved by this job:** that the UI renders, that a verification"
            echo "runs, or that an update applies. Those are the smoke flow and the"
            echo "updater leg, which are still to be built. See BL-TEST-001."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-installer-test
          path: artefacts/
          retention-days: 14
          if-no-files-found: warn

  windows:
    name: Windows (MSI + NSIS)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve the tag under test
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${EVENT_TAG:-}}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo Jura-Labs/jura-trace --json tagName --jq .tagName)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download the Windows installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dl
          for asset in "JuraTrace-${VERSION}-Windows-x64.msi" "JuraTrace-${VERSION}-Windows-x64-setup.exe"; do
            if ! gh release download "$TAG" --repo Jura-Labs/jura-trace --pattern "$asset" --dir dl; then
              echo "::error::$asset is not attached to $TAG."
              gh release view "$TAG" --repo Jura-Labs/jura-trace --json assets --jq '.assets[].name' | sed 's/^/  /'
              exit 1
            fi
          done
          ls -lh dl/

      # ── NSIS first, deliberately ──────────────────────────────────────────
      # The order matters and is the whole point of the assertion below. A
      # user who installed with the NSIS setup.exe is the one the updater can
      # strand: it detects the downloaded artefact's format and runs the
      # matching installer without checking how the app was installed.
      - name: Install with the NSIS installer (/S)
        shell: pwsh
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          $exe = "dl/JuraTrace-$env:VERSION-Windows-x64-setup.exe"
          Write-Host "installing $exe silently"
          $p = Start-Process -FilePath $exe -ArgumentList "/S" -Wait -PassThru
          Write-Host "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "NSIS install failed with $($p.ExitCode)" }

      - name: Record where NSIS installed it
        id: nsis
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path "$env:LOCALAPPDATA","$env:ProgramFiles","${env:ProgramFiles(x86)}" `
            -Filter "*.exe" -Recurse -Depth 3 -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "*ura*race*" -or $_.Name -eq "jura-trace.exe" } |
            Select-Object -ExpandProperty FullName -Unique
          if (-not $found) { throw "No installed executable found after the NSIS install." }
          Write-Host "NSIS install location(s):"
          $found | ForEach-Object { Write-Host "  $_" }
          New-Item -ItemType Directory -Force -Path artefacts | Out-Null
          $found | Set-Content artefacts/nsis-paths.txt
          "paths<<EOF" >> $env:GITHUB_OUTPUT
          $found -join "`n" >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      # ── Now the MSI, which is what the updater would serve ────────────────
      - name: Install with the MSI (/qn), as an update would
        shell: pwsh
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          $msi = Resolve-Path "dl/JuraTrace-$env:VERSION-Windows-x64.msi"
          Write-Host "installing $msi silently"
          $p = Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/qn","/norestart","/l*v","artefacts\msi-install.log" -Wait -PassThru
          Write-Host "exit code: $($p.ExitCode)"
          # 0 = success, 3010 = success, reboot required
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "MSI install failed with $($p.ExitCode)" }

      - name: Record install locations after the MSI
        shell: pwsh
        run: |
          $after = Get-ChildItem -Path "$env:LOCALAPPDATA","$env:ProgramFiles","${env:ProgramFiles(x86)}" `
            -Filter "*.exe" -Recurse -Depth 3 -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "*ura*race*" -or $_.Name -eq "jura-trace.exe" } |
            Select-Object -ExpandProperty FullName -Unique
          $after | Set-Content artefacts/after-msi-paths.txt
          Write-Host "install location(s) after MSI:"
          $after | ForEach-Object { Write-Host "  $_" }

      - name: Launch the installed app and probe it
        shell: pwsh
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          $exe = (Get-Content artefacts/after-msi-paths.txt | Select-Object -First 1)
          Write-Host "launching $exe"
          Start-Process -FilePath $exe
          $health = $null
          foreach ($i in 1..60) {
            try {
              $health = Invoke-RestMethod -Uri "http://127.0.0.1:8300/api/v1/health" -TimeoutSec 3
              Write-Host "health responded after ~${i}s"
              break
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $health) { throw "The installed app did not answer /api/v1/health within 60s." }
          $health | ConvertTo-Json | Set-Content artefacts/health.json
          Write-Host "status            : $($health.status)"
          Write-Host "version (running) : $($health.version)"
          Write-Host "sidecar available : $($health.sidecarAvailable)"
          $core = $env:VERSION.Split("-")[0]
          if ($health.status -ne "ok") { throw "health status is '$($health.status)', expected 'ok'." }
          if ($health.version -ne $core) { throw "The running app reports '$($health.version)' but the tag is '$core'." }
          Write-Host "OK: the installed app runs and agrees with the tag."

      - name: Stop the app
        if: always()
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.ProcessName -like "*ura*race*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          exit 0

      # ── The assertion that is expected to fail ────────────────────────────
      #
      # BL-TEST-001, and Paul was explicit on 4 September: DO NOT SOFTEN THIS
      # TO MAKE THE WORKFLOW GREEN.
      #
      # An MSI-offered update must not create a parallel install alongside an
      # NSIS one. On current evidence it does, leaving the user's shortcuts
      # pointing at the old per-user copy while a second per-machine copy sits
      # elsewhere, updated and unused.
      #
      # It runs LAST on purpose. Everything above it — install, launch, health
      # probe — still executes and reports, so this job keeps catching other
      # faults while this one stands. It is deliberately NOT continue-on-error:
      # that would leave the job green with a red step buried inside it, which
      # is the softening this comment exists to forbid.
      #
      # A red job naming a real defect is the correct state, and is more useful
      # than a green suite adjusted until it agrees with the bug. When the
      # underlying problem is fixed, by dropping NSIS or by serving
      # per-installer manifests, this turns green on its own and means
      # something.
      - name: An MSI-offered update must not create a parallel install
        id: parallel
        shell: pwsh
        run: |
          $before = Get-Content artefacts/nsis-paths.txt
          $after  = Get-Content artefacts/after-msi-paths.txt
          Write-Host "after NSIS  : $($before.Count) location(s)"
          $before | ForEach-Object { Write-Host "  $_" }
          Write-Host "after MSI   : $($after.Count) location(s)"
          $after | ForEach-Object { Write-Host "  $_" }

          $extra = $after | Where-Object { $before -notcontains $_ }
          if ($extra) {
            Write-Host "::error::The MSI created a parallel install. A user who installed with setup.exe keeps shortcuts pointing at the original copy, which the update did not touch."
            $extra | ForEach-Object { Write-Host "::error::  parallel install at $_" }
            Write-Host ""
            Write-Host "This is EXPECTED to fail until the underlying problem is fixed."
            Write-Host "See BL-TEST-001. Do not soften it to get a green run."
            exit 1
          }
          Write-Host "OK: no parallel install. If this is the first pass, the underlying fix has landed."

      - name: Summary
        if: always()
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PARALLEL: ${{ steps.parallel.outcome }}
        run: |
          {
            echo "## Windows installer test — $TAG"
            echo ""
            echo "NSIS silent install, then an MSI install standing in for what the"
            echo "updater would serve, then a health probe of the installed app."
            echo ""
            if [ "$PARALLEL" = "failure" ]; then
              echo "**Parallel-install assertion: FAILED, and that is the expected result.**"
              echo ""
              echo "The MSI created an install alongside the NSIS one. A user who"
              echo "installed with setup.exe and accepts an update keeps shortcuts"
              echo "pointing at the original copy, while the updated copy sits"
              echo "elsewhere, unused."
              echo ""
              echo "Do not soften this assertion. It turns green when the underlying"
              echo "problem is fixed, and means something when it does. BL-TEST-001."
            else
              echo "**Parallel-install assertion: passed.** If this is the first pass,"
              echo "the underlying fix has landed and BL-TEST-001 should record it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer-test
          path: artefacts/
          retention-days: 14
          if-no-files-found: warn

  updater-contract:
    name: Updater manifest contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # This is the leg that guards BL-REL-002. It checks the LIVE endpoint an
      # installed app actually polls, not a fixture, because the defect that
      # stranded 145 users was only visible from the client's side of the wire.
      #
      # What it proves and what it does not, stated here rather than implied:
      # a well-formed, correctly signed manifest pointing at assets that exist.
      # It does NOT prove an update applies. That needs a previous version
      # installed and the endpoint redirected, and on Linux it is currently
      # impossible at all, because Tauri's Linux updater installs AppImages and
      # the pipeline builds --bundles deb only. See BL-REL-003 fault 2.
      - name: Check the live update manifest
        run: |
          set -euo pipefail
          mkdir -p artefacts
          curl -fsS --max-time 20 https://juralabs.org/api/updates/latest.json \
            -o artefacts/latest.json || {
              echo "::error::The live update endpoint did not return a manifest."
              exit 1
            }
          echo "── manifest ──"
          python3 -m json.tool artefacts/latest.json | head -40

          python3 - <<'CHECK'
          import base64, json, pathlib, sys, urllib.request

          manifest = json.loads(pathlib.Path("artefacts/latest.json").read_text())
          conf = json.loads(pathlib.Path("src-tauri/tauri.conf.json").read_text())

          def key_id(blob_b64: str) -> str:
              """minisign key id from a base64-wrapped minisign file."""
              inner = base64.b64decode(blob_b64).decode()
              raw = base64.b64decode(inner.splitlines()[1])
              return raw[2:10][::-1].hex().upper()

          app_key = key_id(conf["plugins"]["updater"]["pubkey"])
          print(f"app public key id: {app_key}")

          platforms = manifest.get("platforms") or {}
          if not platforms:
              print("::error::Manifest declares no platforms at all. Every client reads this as 'up to date', forever.")
              sys.exit(1)

          failures = []
          for name, block in sorted(platforms.items()):
              sig = block.get("signature", "")
              url = block.get("url", "")
              print(f"\n{name}")
              print(f"  url: {url}")

              # 1. The defect that stranded 145 users: a URL where the inline
              #    minisign blob belongs. Tauri rejects every such update.
              if sig.startswith("http://") or sig.startswith("https://"):
                  print("  ::error::signature field contains a URL, not a signature")
                  failures.append(f"{name}: signature is a URL")
                  continue
              if not sig or len(sig) < 64:
                  print("  ::error::signature field is empty or too short to be a minisign blob")
                  failures.append(f"{name}: signature missing")
                  continue

              # 2. Signed by the key this app actually trusts. Catches a key
              #    rotation that reaches the signer but not the binary, which
              #    is how rc.25 installers ended up unable to update at all.
              try:
                  sk = key_id(sig)
              except Exception as e:
                  print(f"  ::error::signature is not a decodable minisign file: {e}")
                  failures.append(f"{name}: undecodable signature")
                  continue
              match = sk == app_key
              print(f"  signature key id: {sk} {'(matches)' if match else '(MISMATCH)'}")
              if not match:
                  failures.append(f"{name}: signed by {sk}, app trusts {app_key}")

              # 3. The asset exists. An absent one is how Linux silently
              #    vanished from the manifest.
              try:
                  req = urllib.request.Request(url, method="HEAD")
                  with urllib.request.urlopen(req, timeout=20) as r:
                      print(f"  asset: HTTP {r.status}")
              except Exception as e:
                  print(f"  ::error::asset URL does not resolve: {e}")
                  failures.append(f"{name}: url unreachable")

          print("\n── result ──")
          if failures:
              for f in failures:
                  print(f"::error::{f}")
              sys.exit(1)
          print(f"OK: {len(platforms)} platform(s), all inline-signed by {app_key}, all assets reachable.")
          CHECK

      - name: Summary
        if: always()
        run: |
          {
            echo "## Updater manifest contract"
            echo ""
            echo "Checks the live endpoint an installed app actually polls."
            echo ""
            echo "**Asserts:** the manifest declares at least one platform; no"
            echo "signature field contains a URL where the inline minisign blob"
            echo "belongs; every signature is signed by the key the app trusts;"
            echo "and every asset URL resolves."
            echo ""
            echo "**Does not assert that an update applies.** That needs a previous"
            echo "version installed and the endpoint redirected. On Linux it is"
            echo "currently impossible: Tauri's Linux updater installs AppImages"
            echo "and the pipeline builds deb only (BL-REL-003 fault 2)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: updater-contract
          path: artefacts/
          retention-days: 14
          if-no-files-found: warn
