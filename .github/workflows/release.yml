name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.9.0-rc.14)"
        required: true
      platforms:
        description: "Which platforms to build"
        type: choice
        required: false
        default: all
        options:
          - all
          - macos-only
          - windows-only
          - linux-only

# contents: write is still needed for checking out source from jura-archive.
# All release creation/publishing targets Jura-Labs/jura-trace via RELEASE_PAT.
permissions:
  contents: write

jobs:
  # ── Phase 1: Create a draft release with changelog body ───────────────────
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      tag: ${{ steps.resolve-tag.outputs.tag }}
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Resolve the release tag to a named step output so downstream jobs
      # (publish-release: SHA256SUMS + update manifest) get a non-empty tag.
      # On workflow_dispatch github.ref_name is the branch ("main"), so prefer
      # the explicit inputs.tag; fall back to ref_name for tag-push runs.
      - name: Resolve tag
        id: resolve-tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # The tag and the code must agree about what version this is.
      #
      # Tauri names every artefact from tauri.conf.json's version, and the
      # upload step then friendly-renames using the TAG. So a tag cut without
      # bumping the version produces installers whose FILENAME claims one
      # version while their CONTENTS declare another: the .deb's Version
      # field, the app's own /api/v1/health response, and the raw .sig names
      # all keep the old number.
      #
      # Observed in the 7 September smoke run, where the artefacts were named
      # 1.1.0-rc.0-smoke-20260907 and the signatures were still
      # Jura.Trace_1.0.0_amd64.AppImage.sig. Nothing in the pipeline noticed.
      # That is the same family as the sidecar shipping as 0.9.0 while the app
      # called itself 1.0.0 (BL-TEST-001).
      #
      # This is a GATE, not an auto-bump. Silently rewriting the version
      # during a release would hide exactly the mistake worth catching, and a
      # version bump should be a deliberate commit that gets reviewed.
      #
      # Compares the numeric core only (X.Y.Z), so pre-release suffixes on the
      # tag — rc, beta, the -smoke-YYYYMMDD pattern — do not need to be
      # mirrored in the manifests.
      - name: The tag agrees with the declared version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag_core="${RELEASE_TAG#v}"; tag_core="${tag_core%%-*}"

          conf=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          pkg=$(python3 -c "import json;print(json.load(open('ui/package.json')).get('version',''))")

          echo "tag              : ${RELEASE_TAG}  (core ${tag_core})"
          echo "tauri.conf.json  : ${conf}"
          echo "Cargo.toml       : ${cargo}"
          echo "ui/package.json  : ${pkg}"

          fail=0
          for pair in "tauri.conf.json:${conf}" "Cargo.toml:${cargo}" "ui/package.json:${pkg}"; do
            name="${pair%%:*}"; val="${pair#*:}"; core="${val%%-*}"
            if [ "$core" != "$tag_core" ]; then
              echo "::error::${name} declares ${val}, but the tag is ${RELEASE_TAG} (core ${tag_core})."
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Bump the version in all three files to ${tag_core}, commit, and re-tag."
            echo "Do not work around this by changing the tag: the artefacts would"
            echo "still carry the old version inside them."
            exit 1
          fi
          echo "OK: the tag and the code agree."

      # Build the release body to a FILE, not an output variable.  Writing
      # via `${{ steps.x.outputs.y }}` round-trips the body through
      # GHA expression interpolation → env var → JS env → REST API JSON,
      # which mangles non-ASCII characters (em-dashes, smart quotes) and
      # truncates Markdown bullets at unexpected boundaries.  rc.24
      # shipped a body that was 88% shorter than the source CHANGELOG
      # entry because of this — the file-based approach below avoids
      # every escape boundary.
      #
      # The body is composed of three parts (in order):
      #   1. A pinned tester-friendly header (overview + download
      #      table + GETTING_STARTED link + social card)
      #   2. The latest CHANGELOG.md section (extracted via awk —
      #      first `## ` block to the next `## `, no Python regex)
      #   3. A pinned footer (privacy / licence / feedback)
      - name: Build release body
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          body_file="${RUNNER_TEMP}/release-body.md"

          # Extract the most recent CHANGELOG section.  awk approach
          # avoids the unicode-stripping bugs of the previous Python
          # regex pipeline.
          changelog_section=$(awk '
            /^## / { if (in_section) exit; in_section=1 }
            in_section { print }
          ' CHANGELOG.md || echo "See CHANGELOG.md for details.")

          # Compose download URLs from the tag.  Filename pattern is
          #   JuraTrace-<semver>-<rc-suffix>-<platform>-<arch>.<ext>
          # which we derive by stripping the leading "v" from the tag.
          ver="${tag#v}"
          base="https://github.com/Jura-Labs/jura-trace/releases/download/${tag}"
          dmg_name="JuraTrace-${ver}-macOS-AppleSilicon.dmg"
          msi_name="JuraTrace-${ver}-Windows-x64.msi"
          exe_name="JuraTrace-${ver}-Windows-x64-setup.exe"
          # Restored 6 September 2026, in the same commit that puts appimage
          # back into --bundles, which is the condition the removal note set.
          # It is safe to link again because the pre-publish gate now asserts
          # every link in the body is an uploaded asset, so if the AppImage
          # build fails this row cannot reach users advertising a 404.
          appimage_name="JuraTrace-${ver}-Linux-x86_64.AppImage"
          deb_name="JuraTrace-${ver}-Linux-x86_64.deb"

          # Write the full body via heredoc — no shell interpolation
          # of the changelog text (single-quoted FOOTER heredoc).
          cat > "$body_file" <<HEADER
          ![Jura Trace — Know What's Real.](https://raw.githubusercontent.com/Jura-Labs/jura-trace/main/docs/branding/jura-trace-og-1280x640.png)

          ## Jura Trace ${tag}

          > **First-time pilot tester?** Read the **[Getting Started guide](https://github.com/Jura-Labs/jura-trace/blob/main/GETTING_STARTED.md)** — install + your first Content Credentials verification in 10 minutes.

          **Jura Trace** examines images, videos and documents and tells you what it finds — honestly, and without certainty where none exists. Twelve forensic detectors plus full C2PA Content Credentials verification, running entirely on your device. No cloud, no accounts, no telemetry.

          ## Download

          | If you have… | Download | Signed by |
          |---|---|---|
          | **Mac** (Apple Silicon — M1/M2/M3/M4) | **[${dmg_name}](${base}/${dmg_name})** | Apple Developer ID (notarised) |
          | **Windows** (64-bit) — *recommended* | **[${msi_name}](${base}/${msi_name})** | Azure Trusted Signing |
          | **Windows** (64-bit) — *NSIS installer* | **[${exe_name}](${base}/${exe_name})** | Azure Trusted Signing |
          | **Linux** (x86\_64) — *AppImage* | **[${appimage_name}](${base}/${appimage_name})** | Self-signed (AGPL source build) |
          | **Linux** (x86\_64) — *DEB package* | **[${deb_name}](${base}/${deb_name})** | Self-signed (AGPL source build) — install with \`sudo apt install ./<file>\` |

          **Verify your download:** grab **[SHA256SUMS.txt](${base}/SHA256SUMS.txt)** and run \`shasum -a 256 -c SHA256SUMS.txt\` (macOS / Linux) or \`certutil -hashfile <filename> SHA256\` (Windows).

          Full install + first-test walkthrough: **[GETTING_STARTED.md](https://github.com/Jura-Labs/jura-trace/blob/main/GETTING_STARTED.md)**.

          ---

          <details>
          <summary><b>Technical changelog</b></summary>

          HEADER

          # Append the changelog section verbatim
          printf '%s\n' "$changelog_section" >> "$body_file"

          # Footer (single-quoted heredoc — no shell interpolation)
          cat >> "$body_file" <<'FOOTER'

          </details>

          ---

          - **Privacy:** everything runs on your device. No telemetry, no accounts.
          - **Licence:** [AGPL-3.0-or-later](https://github.com/Jura-Labs/jura-trace/blob/main/LICENSE) — free and open source, with a parallel commercial-licence path documented in [COMMERCIAL.md](https://github.com/Jura-Labs/jura-trace/blob/main/COMMERCIAL.md).
          - **Security:** [SECURITY.md](https://github.com/Jura-Labs/jura-trace/blob/main/SECURITY.md)
          - **Bugs:** [open an issue](https://github.com/Jura-Labs/jura-trace/issues/new/choose)
          - **General:** [hello@juralabs.org](mailto:hello@juralabs.org) • [juralabs.org](https://juralabs.org)
          FOOTER

          # Truncate to 124 KB (well under GitHub's 125 KB body limit)
          if [ "$(wc -c < "$body_file")" -gt 125000 ]; then
            head -c 124500 "$body_file" > "$body_file.tmp"
            printf '\n\n...(truncated — see [CHANGELOG.md](https://github.com/Jura-Labs/jura-trace/blob/main/CHANGELOG.md) for full details)\n' >> "$body_file.tmp"
            mv "$body_file.tmp" "$body_file"
          fi

          echo "body_file=$body_file" >> "$GITHUB_OUTPUT"
          echo "Built release body: $(wc -c < "$body_file") bytes"

      - name: Create draft release
        id: create
        # Uses RELEASE_PAT so the release is created on Jura-Labs/jura-trace
        # (the PUBLIC releases-only repo), not on Jura-Labs/jura-archive
        # (the PRIVATE source repo). Users who download installers must never
        # need access to jura-archive.
        #
        # Reads the body from a file via fs.readFileSync — bypasses the
        # GHA expression / env var escape pipeline that mangled rc.24.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_BODY_FILE: ${{ steps.changelog.outputs.body_file }}
        with:
          github-token: ${{ secrets.RELEASE_PAT }}
          script: |
            const fs = require('fs');
            const tag = ('${{ github.event.inputs.tag }}' || context.ref.replace('refs/tags/', ''));
            const body = fs.readFileSync(process.env.RELEASE_BODY_FILE, 'utf8');
            const prerelease = /-(rc|beta|alpha)/.test(tag);

            // Idempotent: workflow_dispatch can re-run this workflow on an
            // existing tag (e.g. to validate a single-platform fix without
            // burning the other platform's CI minutes).  In that case the
            // release on jura-trace already exists; reuse it instead of
            // failing with HTTP 422.  Only the body is refreshed — everything
            // else is left as-is so previously-uploaded assets survive.
            try {
              const { data: existing } = await github.rest.repos.getReleaseByTag({
                owner: 'juralabs',
                repo: 'jura-trace',
                tag,
              });
              console.log(`Reusing existing release ${existing.id} for tag ${tag}`);
              await github.rest.repos.updateRelease({
                owner: 'juralabs',
                repo: 'jura-trace',
                release_id: existing.id,
                body,
              });
              return existing.id;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const { data } = await github.rest.repos.createRelease({
              owner: 'juralabs',
              repo: 'jura-trace',
              tag_name: tag,
              name: `Jura Trace ${tag}`,
              body,
              draft: true,
              prerelease,
            });
            return data.id;

  # ── Phase 2a: Compute the platform matrix for this run ──────────────────
  # GitHub Actions doesn't allow `matrix.*` references in job-level `if:`,
  # so we can't gate matrix entries directly.  Instead we build the matrix
  # dynamically here based on the workflow_dispatch `platforms` input.
  # Tag-push runs (and workflow_dispatch with platforms=all or empty) get
  # the full matrix; explicit macos-only / windows-only narrows it.
  prepare-matrix:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        shell: bash
        run: |
          PLATFORMS="${{ github.event.inputs.platforms }}"
          [ -z "$PLATFORMS" ] && PLATFORMS="all"

          # macOS reverted from self-hosted Mac mini to GitHub-hosted
          # macos-latest (2026-04-26).  Self-hosted hit two blockers that
          # neither library-validation entitlements nor a full TCC re-grant
          # could close: macOS Sequoia denies launchd-spawned ad-hoc-signed
          # processes (Runner.Listener) keychain access for codesign even
          # after re-signing with Developer ID.  The cost (~£0.30/build,
          # macos-latest minutes) is trivial against the time spent
          # debugging.  rc.21/rc.22 used cloud macos-latest successfully —
          # this is a return to the known-working configuration.
          # When self-hosted is fixed (see backlog), restore:
          #   "runner":["self-hosted","macOS","ARM64","m4"]
          MAC='{"label":"macOS (Apple Silicon)","runner":"macos-latest","target":"aarch64-apple-darwin","sidecar_name":"jura-sidecar-aarch64-apple-darwin","platform":"macos-only"}'
          WIN='{"label":"Windows (x64)","runner":"windows-latest","target":"x86_64-pc-windows-msvc","sidecar_name":"jura-sidecar-x86_64-pc-windows-msvc.exe","platform":"windows-only"}'
          LIN='{"label":"Linux (x64)","runner":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","sidecar_name":"jura-sidecar-x86_64-unknown-linux-gnu","platform":"linux-only"}'

          case "$PLATFORMS" in
            macos-only)   INCLUDE="[$MAC]" ;;
            windows-only) INCLUDE="[$WIN]" ;;
            linux-only)   INCLUDE="[$LIN]" ;;
            all|*)        INCLUDE="[$MAC,$WIN,$LIN]" ;;
          esac
          echo "Selected platforms: $PLATFORMS"
          echo "matrix={\"include\":$INCLUDE}" >> "$GITHUB_OUTPUT"

  # ── Phase 2b: Build platform artefacts in parallel ──────────────────────
  build:
    name: Build (${{ matrix.label }})
    needs: [create-release, prepare-matrix]
    strategy:
      # Continue building other platforms even if one fails.
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}
    # The sidecar build (torch + open_clip) can take 10-20 minutes alone on
    # a cold cache. Linux Rust compilation is slower on standard GHA runners
    # than macOS; 120 minutes avoids timeout failures on cold Linux builds.
    # If builds are consistently hitting 90+ minutes, add sccache (see
    # docs/development-workflow.md M2 for the sccache configuration pattern).
    # Raised from 120 on 6 September 2026 to give the AppImage squashfs pass
    # over the ~607 MB CLIP onnx room it has never been measured needing.
    # Windows and macOS are unaffected; they finish far inside either number.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ── Self-hosted macOS runner: writable tool cache ───────────────────
      # GHA's setup-* actions default to RUNNER_TOOL_CACHE=/Users/runner/hostedtoolcache,
      # the path baked into the cloud `macos-latest` image where the runner user is
      # `runner`. On Paul's Mac mini the runner user is `paulgriffiths`, so the
      # default path is unwritable and `mkdir: /Users/runner: Permission denied`
      # kills setup-python. Point both the tool cache and the runner workspace at
      # paths under $HOME — set BEFORE setup-python so it picks them up.
      - name: Configure self-hosted runner paths (macOS)
        if: runner.environment != 'github-hosted' && runner.os == 'macOS'
        shell: bash
        run: |
          # ── 1. Tool cache override ─────────────────────────────────────
          # GHA actions default RUNNER_TOOL_CACHE to /Users/runner/...,
          # which doesn't exist on this machine (runner user is
          # paulgriffiths).  Point it at $HOME.
          TOOL_CACHE="$HOME/.runner-tool-cache"
          mkdir -p "$TOOL_CACHE"
          echo "RUNNER_TOOL_CACHE=$TOOL_CACHE" >> "$GITHUB_ENV"
          echo "AGENT_TOOLSDIRECTORY=$TOOL_CACHE" >> "$GITHUB_ENV"

          # ── 2. CARGO_HOME isolation (TCC workaround) ──────────────────
          # Runner.Listener is launchd-spawned and ad-hoc signed.  macOS
          # Sequoia's tightened TCC denies it access to user-data paths
          # under ~/.cargo even though file mode bits allow it
          # (`Operation not permitted` / EPERM, not EACCES).  A
          # user-Terminal shell with the same UID can read the same file
          # fine — the difference is process TCC context, not POSIX perms.
          # Granting Runner.Listener Full Disk Access in System Settings
          # would also work but isn't reproducible after a runner reinstall.
          # Isolating CARGO_HOME under the runner installation dir avoids
          # the TCC perimeter entirely (paths managed by the runner agent's
          # own filesystem context).  ~285 MB of registry will repopulate
          # on first run; subsequent runs hit the cache step below.
          RUNNER_CARGO="$HOME/actions-runner/.cargo-home"
          mkdir -p "$RUNNER_CARGO"
          echo "CARGO_HOME=$RUNNER_CARGO" >> "$GITHUB_ENV"

          # ── 3. CARGO_TARGET_DIR pin ───────────────────────────────────
          # Runner inherits the user's shell env which exports
          # CARGO_TARGET_DIR=/Volumes/MAC SSD/dev/cargo-target (a local
          # disk-saving override).  That bypasses the workflow's cache
          # path (src-tauri/target/) and risks colliding with stale
          # local-build artefacts left there by `make build` runs.
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/src-tauri/target" >> "$GITHUB_ENV"

          # ── 4. Strip user shell's sccache + cargo overrides ──────────
          # Runner inherits the user's shell env which exports
          #   RUSTC_WRAPPER=sccache
          #   SCCACHE_DIR=/Volumes/MAC SSD/dev/sccache
          #   SCCACHE_CACHE_SIZE=20G
          # for fast local rebuilds.  Inside CI:
          #   - sccache wraps every rustc invocation
          #   - cargo's normal file handling collides with sccache's
          #     access patterns to the registry, producing EPERM on
          #     .crate file opens (root cause of rc.24's macOS failure)
          # Unset these so cargo runs vanilla.  GHA's $GITHUB_ENV doesn't
          # support unset; setting to empty string + a marker comment
          # achieves the same result for downstream steps.
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=" >> "$GITHUB_ENV"

          # ── 5. Defensive cleanup ──────────────────────────────────────
          rm -rf "$GITHUB_WORKSPACE/src-tauri/target/release/bundle" 2>/dev/null || true

          echo "Self-hosted env pinned:"
          echo "  RUNNER_TOOL_CACHE=$TOOL_CACHE"
          echo "  CARGO_HOME=$RUNNER_CARGO"
          echo "  CARGO_TARGET_DIR=$GITHUB_WORKSPACE/src-tauri/target"
          echo "  RUSTC_WRAPPER=(unset, was sccache)"
          echo "  SCCACHE_DIR=(unset)"

      # ── Linux: free disk space before anything else ──────────────────────
      # ubuntu-22.04 runners start with ~25 GB free. The ML sidecar deps
      # (torch, opencv, etc.) plus the Tauri Rust build together exceed that.
      # Removing unused tool caches recovers 10-15 GB before any build work.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force || true
          df -h /

      # ── Linux: Tauri v2 system dependencies ─────────────────────────────
      # Tauri v2 requires webkit2gtk 4.1 (not 4.0 from Tauri v1).
      # libayatana-appindicator3-dev covers the system-tray feature.
      # libsoup-3.0-dev is a webkit2gtk 4.1 transitive dependency.
      # libjavascriptcoregtk-4.1-dev provides the JSC headers for tauri-build.
      # patchelf is required by tauri-action to patch ELF interpreter paths
      # in the AppImage.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            patchelf

      # ── Rust toolchain ───────────────────────────────────────────────────
      # Pin to the same Rust version as rust-version in Cargo.toml (1.88).
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09
        with:
          toolchain: "1.88"
          targets: ${{ matrix.target }}

      # Cache per target triple — macOS arm64 and x64 produce different artefacts.
      # Cloud runners cache the conventional ~/.cargo/* paths.
      # Self-hosted macOS uses an isolated CARGO_HOME (TCC workaround) so
      # nothing under ~/.cargo is touched there — its caching is handled
      # by the macOS-only step below that targets the isolated path.
      - name: Cache Cargo (cloud runners)
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: cargo-release-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-release-${{ matrix.target }}-

      - name: Cache Cargo (self-hosted macOS)
        if: runner.environment != 'github-hosted' && runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/actions-runner/.cargo-home/bin/
            ~/actions-runner/.cargo-home/registry/index/
            ~/actions-runner/.cargo-home/registry/cache/
            ~/actions-runner/.cargo-home/git/db/
            src-tauri/target/
          key: cargo-release-selfhosted-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-release-selfhosted-${{ matrix.target }}-

      # ── Python: build the frozen sidecar binary ──────────────────────────
      # On GitHub-hosted runners we install Python 3.12 via setup-python.
      # Sidecar targets 3.13; cloud runners only ship 3.12 as of 2026-Q1.
      #
      # On the self-hosted Mac mini we DO NOT use setup-python because
      # actions/setup-python@v5 hard-codes a `mkdir /Users/runner/hostedtoolcache`
      # bootstrap that pre-dates any RUNNER_TOOL_CACHE override and fails
      # before any user step runs (the runner user on this machine is
      # `paulgriffiths`, not `runner`).  We instead use the host's
      # miniconda Python 3.13 which is always present and fully featured.
      # See `docs/development-workflow.md` for the runner setup contract.
      - name: Setup Python 3.12 (cloud runners only)
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Configure host Python (self-hosted macOS)
        if: runner.environment != 'github-hosted' && runner.os == 'macOS'
        shell: bash
        run: |
          # Pin to the miniconda Python 3.13 that ships with the Mac mini.
          # Resolve via `command -v` so we still error loudly if it's missing.
          PY="$(command -v python3 || true)"
          if [ -z "$PY" ]; then
            echo "::error::No python3 on PATH on the self-hosted runner"
            exit 1
          fi
          echo "Using $($PY --version) at $PY"
          # Prepend its bin dir to PATH for subsequent steps so `python`,
          # `python3`, `pip`, and `pip3` all resolve to the same install.
          echo "$(dirname "$PY")" >> "$GITHUB_PATH"

      # Cache the pip download cache keyed on the pinned lock file so the
      # heavy ML library downloads (torch, opencv, etc.) are skipped on
      # subsequent runs. The PyInstaller build directory is NOT cached because
      # PyInstaller outputs depend on the Python bytecode and linked dylibs,
      # which can vary between runners — a stale cache causes silent breakage.
      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: pip-pyinstaller-${{ matrix.target }}-${{ hashFiles('sidecar/requirements.lock') }}
          restore-keys: pip-pyinstaller-${{ matrix.target }}-

      # Install from the pinned lock file for reproducible builds.
      # PyInstaller is intentionally excluded from requirements.txt and
      # requirements.lock (it is a build tool, not a runtime dependency), so it
      # is installed separately here. Pin to 6.x to match the spike version.
      - name: Install sidecar dependencies
        run: |
          # Use CI-safe requirements (excludes open-clip-torch ~2GB and faster-whisper)
          # These optional deps are lazy-loaded at runtime and degrade gracefully
          if [ -f sidecar/requirements-ci.txt ]; then
            pip install -r sidecar/requirements-ci.txt
          elif [ -f sidecar/requirements.lock ]; then
            pip install -r sidecar/requirements.lock
          else
            pip install -r sidecar/requirements.txt
          fi
          pip install "pyinstaller>=6,<7"
        shell: bash

      # PyInstaller build. Two output modes depending on platform:
      #
      #   macOS (aarch64-apple-darwin) — JTV-184 Phase 5 onedir mode:
      #     JURA_SIDECAR_ONEDIR=1 toggles jura-sidecar.spec to use the
      #     COLLECT block (--onedir output: a directory containing the
      #     bootloader + an _internal/ tree of dylibs). Cold start ~39s vs
      #     ~90-200s for --onefile. The committed launcher stub at
      #     src-tauri/binaries/jura-sidecar-aarch64-apple-darwin (a compiled
      #     Mach-O launcher built from src-tauri/sidecar-launcher/; it was a shell
      #     script until 9 September 2026, see that source for why) execs the bundled bootloader at runtime.
      #
      #   Windows / Linux — onefile mode (unchanged):
      #     spec defaults to EXE-only (no COLLECT) producing a single
      #     self-contained executable. Migrate later if cold-start regressions
      #     surface; for now the Tauri sidecar probe budget tolerates --onefile
      #     on Windows + Linux.
      #
      # JURA_MODELS_DIR is NOT set here because the models/ directory is not
      # bundled inside the frozen binary — see docs/pyinstaller-spike-findings.md.
      # The Rust sidecar.rs sets JURA_MODELS_DIR at spawn time, pointing to the
      # models/ directory that ships alongside the app bundle.
      # NOTE: the models/ directory IS bundled by Tauri via tauri.conf.json
      # "resources": ["models/*"]. The .joblib and ONNX files are placed into
      # src-tauri/models/ by the "Copy model files" and "Download CLIP ONNX"
      # steps above before cargo tauri bundle runs.
      - name: Build frozen sidecar
        env:
          JURA_SIDECAR_ONEDIR: ${{ matrix.target == 'aarch64-apple-darwin' && '1' || '0' }}
        run: python -m PyInstaller jura-sidecar.spec --noconfirm
        working-directory: sidecar

      # ── macOS Phase 5: copy onedir tree to Tauri resources ───────────────
      # The PyInstaller --onedir output is sidecar/dist/jura-sidecar/ containing:
      #   jura-sidecar          (~41 MB bootloader Mach-O)
      #   _internal/            (~480 MB of native libs + Python runtime)
      #
      # Tauri's bundle.resources glob ("sidecar-bundle/**/*") picks this up
      # and places it at Jura Trace.app/Contents/Resources/sidecar-bundle/
      # so the committed launcher stub can locate the sibling _internal/.
      #
      # DO NOT overwrite the launcher stub at src-tauri/binaries/jura-sidecar-
      # aarch64-apple-darwin — it's the shell wrapper Tauri places at
      # Contents/MacOS/jura-sidecar.
      - name: Copy sidecar onedir bundle to Tauri resources (macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          mkdir -p src-tauri/sidecar-bundle
          cp -R sidecar/dist/jura-sidecar/. src-tauri/sidecar-bundle/
          test -x src-tauri/sidecar-bundle/jura-sidecar || (echo "ERROR: bootloader missing from onedir tree" && exit 1)
          test -d src-tauri/sidecar-bundle/_internal || (echo "ERROR: _internal/ missing from onedir tree" && exit 1)
          # The launcher stub MUST remain executable for Tauri's externalBin
          # resolution. Cargo + git generally preserve the +x bit but assert it.
          test -x src-tauri/binaries/${{ matrix.sidecar_name }} || chmod +x src-tauri/binaries/${{ matrix.sidecar_name }}
          echo "--- sidecar-bundle layout ---"
          du -sh src-tauri/sidecar-bundle/
          ls -la src-tauri/sidecar-bundle/ | head -10

      # ── Windows / Linux onefile copy (unchanged from pre-Phase-5) ────────
      # Tauri's externalBin strips the platform triple suffix at build time
      # and re-adds it for each target. The binaries/ directory is gitignored
      # for large native binaries — create if absent.
      - name: Copy sidecar binary to Tauri binaries (Unix, onefile)
        if: runner.os != 'Windows' && matrix.target != 'aarch64-apple-darwin'
        run: |
          mkdir -p src-tauri/binaries
          cp sidecar/dist/jura-sidecar src-tauri/binaries/${{ matrix.sidecar_name }}

      - name: Copy sidecar binary to Tauri binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri\binaries | Out-Null
          Copy-Item sidecar\dist\jura-sidecar.exe src-tauri\binaries\${{ matrix.sidecar_name }}

      # ── Windows + Linux: placeholder for sidecar-bundle resources glob ─────
      # tauri.conf.json declares `"resources": ["models/*", "sidecar-bundle/**/*"]`
      # for the JTV-184 macOS onedir refactor. On Windows + Linux the sidecar is
      # --onefile (no onedir tree), so the directory does not exist and Tauri's
      # strict glob rejects an empty match with "glob pattern ... path not found".
      # Create an empty placeholder so the glob matches one zero-byte file;
      # tauri ships this inside the MSI / AppImage as a harmless artefact.
      # Long-term fix: platform-conditional resources in tauri.conf.json (not
      # yet supported by Tauri v2 schema as a per-bundle override).
      - name: Create empty sidecar-bundle placeholder (Windows + Linux)
        if: matrix.target != 'aarch64-apple-darwin'
        shell: bash
        run: |
          mkdir -p src-tauri/sidecar-bundle
          touch src-tauri/sidecar-bundle/.keep
          ls -la src-tauri/sidecar-bundle/

      # ── Copy ML model files into bundle ────────────────────────────────
      # The GBM classifier and UnivFD probe must ship alongside the sidecar.
      # Tauri bundles them via the "resources" config in tauri.conf.json.
      - name: Copy model files to Tauri resources
        run: |
          mkdir -p src-tauri/models
          cp models/deepfake_classifier.joblib src-tauri/models/ 2>/dev/null || true
          cp models/univfd_probe.joblib src-tauri/models/ 2>/dev/null || true
          ls -la src-tauri/models/
        shell: bash

      # ── Download CLIP ONNX models (Windows + Linux only) ───────────────────
      # The CLIP/UnivFD ONNX models (~607 MB total) are too large to commit to
      # the source repo. macOS builds them from the dev machine via
      # scripts/build-local-mac.sh which reads from models/ directly.
      #
      # For Windows + Linux CI builds, the four model files are hosted as assets
      # on a dedicated GitHub Release (tag: model-assets-clip-v1) in the public
      # Jura-Labs/jura-trace repo. CI downloads them here, verifies SHA-256
      # against the manifest committed at scripts/onnx-model-sha256.manifest,
      # and places them in src-tauri/models/ before `cargo tauri bundle`.
      #
      # To update the ONNX models:
      #   1. Re-export the models (scripts/export_clip_onnx.py).
      #   2. Upload the four new files to a new release tag on jura-trace,
      #      e.g. `model-assets-clip-v2`.
      #   3. Update ONNX_ASSET_TAG below to the new tag.
      #   4. Recompute SHA-256s: sha256sum models/clip-vit-b32-*.onnx*
      #   5. Update scripts/onnx-model-sha256.manifest with the new hashes.
      #   6. Commit steps 3-5 together in a single PR.
      #
      # The build FAILS if any file is missing or its SHA-256 does not match.
      # Never set continue-on-error on this step — a mismatch means the models
      # may have been tampered with or the wrong version was fetched.
      #
      # HUMAN ACTION REQUIRED before the first Windows/Linux CI run:
      #   Upload the four ONNX files to Jura-Labs/jura-trace as a release:
      #     gh release create model-assets-clip-v1 \
      #       --repo Jura-Labs/jura-trace \
      #       --title "CLIP ONNX model assets v1" \
      #       --notes "CLIP ViT-B/32 ONNX models for CI sidecar builds. Not a user installer release." \
      #       models/clip-vit-b32-text.onnx \
      #       models/clip-vit-b32-text.onnx.data \
      #       models/clip-vit-b32-vision.onnx \
      #       models/clip-vit-b32-vision.onnx.data
      #   Run from the repo root with RELEASE_PAT (repo scope on jura-trace) in env:
      #     GITHUB_TOKEN=$RELEASE_PAT gh release create ...
      - name: Download CLIP ONNX models (Windows + Linux)
        if: matrix.target != 'aarch64-apple-darwin'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          # Bump this tag when new ONNX model files are uploaded to jura-trace.
          # Also update scripts/onnx-model-sha256.manifest with the new hashes.
          ONNX_ASSET_TAG: model-assets-clip-v1
        run: |
          set -euo pipefail

          echo "Downloading CLIP ONNX models from Jura-Labs/jura-trace@${ONNX_ASSET_TAG} ..."

          # Download all four model files from the dedicated release.
          # gh release download --pattern is idiomatic; --dir avoids cwd clutter.
          mkdir -p onnx-download
          gh release download "${ONNX_ASSET_TAG}" \
            --repo Jura-Labs/jura-trace \
            --pattern "clip-vit-b32-text.onnx" \
            --pattern "clip-vit-b32-text.onnx.data" \
            --pattern "clip-vit-b32-vision.onnx" \
            --pattern "clip-vit-b32-vision.onnx.data" \
            --dir onnx-download

          echo "Downloaded files:"
          ls -lh onnx-download/

          # Verify SHA-256 hashes against the committed manifest.
          # sha256sum -c expects paths relative to the working directory;
          # we temporarily cd so the manifest paths (models/...) align with
          # where the files now sit.
          # The manifest uses paths like "models/clip-vit-b32-text.onnx" so
          # we create a temporary models/ alias for the check.
          mkdir -p onnx-verify/models
          cp onnx-download/clip-vit-b32-text.onnx      onnx-verify/models/
          cp onnx-download/clip-vit-b32-text.onnx.data onnx-verify/models/
          cp onnx-download/clip-vit-b32-vision.onnx      onnx-verify/models/
          cp onnx-download/clip-vit-b32-vision.onnx.data onnx-verify/models/

          echo "Verifying SHA-256 hashes against scripts/onnx-model-sha256.manifest ..."
          # Strip comments from the manifest before piping to sha256sum -c.
          grep -v '^\s*#' scripts/onnx-model-sha256.manifest | grep -v '^\s*$' > /tmp/onnx-hashes.txt
          (cd onnx-verify && sha256sum -c /tmp/onnx-hashes.txt)
          echo "SHA-256 verification PASSED."

          # Place verified models into src-tauri/models/ alongside the joblibs.
          cp onnx-verify/models/clip-vit-b32-text.onnx      src-tauri/models/
          cp onnx-verify/models/clip-vit-b32-text.onnx.data src-tauri/models/
          cp onnx-verify/models/clip-vit-b32-vision.onnx      src-tauri/models/
          cp onnx-verify/models/clip-vit-b32-vision.onnx.data src-tauri/models/

          echo "src-tauri/models/ contents after ONNX copy:"
          ls -lh src-tauri/models/

          # Clean up scratch directories.
          rm -rf onnx-download onnx-verify

      # ── Windows: sign sidecar binary BEFORE Tauri bundles it ────────────
      # Windows Defender frequently quarantines unsigned PyInstaller binaries.
      # Signing the sidecar .exe before Tauri packages it into the installer
      # means the binary inside the installed app is trusted by Defender.
      - name: Sign sidecar binary with Azure Trusted Signing
        if: runner.os == 'Windows'
        uses: azure/trusted-signing-action@07c81171dd46a04e1b9f382b6c693815828bbbf7 # v0.5.0
        with:
          azure-tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret:   ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint:              ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name:     ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder:          src-tauri/binaries
          files-folder-filter:   exe
          files-folder-depth:    1
          file-digest:           SHA256
          timestamp-rfc3161:     http://timestamp.acs.microsoft.com
          timestamp-digest:      SHA256

      # ── Node.js: build the SvelteKit frontend ───────────────────────────
      # tauri-action calls `npm install` in the project root by default, but
      # our frontend lives in ui/. Install deps there explicitly before handing
      # off to tauri-action. The beforeBuildCommand in tauri.conf.json
      # (`cd ui && npm run build`) handles the Vite build step at tauri build time.
      - name: Setup Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          # Root package-lock.json does not exist; key on the ui/ one.
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        run: cd ui && npm ci

      # ── Install Tauri CLI ─────────────────────────────────────────────────
      # Two-step install:
      #   1. Install cargo-binstall via `cargo install` against crates.io.
      #      This pulls the version-pinned, crate-author-signed source from
      #      crates.io and compiles locally. Slower than the upstream
      #      curl-pipe-bash install script (~30s extra), but eliminates the
      #      "unsigned shell script from raw GitHub URL pulled into the
      #      runner that holds Apple + Azure signing credentials" supply-
      #      chain vector flagged in docs/strategy/auto-updater-security-review.md.
      #   2. Use cargo-binstall to pull the prebuilt tauri-cli binary
      #      (~10s) — faster than compiling tauri-cli from source.
      #   3. Both installs are skipped when the cargo cache has already
      #      restored the binary. `cargo install` refuses to overwrite an
      #      existing binary and exits 101 with "binary `cargo-binstall`
      #      already exists in destination". That is what failed the Linux
      #      leg of the v1.1.0 tag build on 10 September 2026, with nothing
      #      wrong with the code and a red X that read like a build break.
      #      It is the same defect ci.yml hit on 8 September with
      #      cargo-audit, and it is fixed the same way here: ask whether the
      #      tool is present rather than assuming it is not. `--force` would
      #      also work but would rebuild a tool that does not change, which
      #      is the cost the cache exists to avoid.
      - name: Install Tauri CLI
        run: |
          if command -v cargo-binstall >/dev/null 2>&1; then
            echo "cargo-binstall restored from cache: $(cargo binstall -V)"
          else
            cargo install cargo-binstall --locked --version "~1.10"
            echo "cargo-binstall built from source: $(cargo binstall -V)"
          fi
          if cargo tauri --version >/dev/null 2>&1; then
            echo "tauri-cli restored from cache: $(cargo tauri --version)"
          else
            cargo binstall tauri-cli --version "2.11.4" --no-confirm
            echo "tauri-cli installed: $(cargo tauri --version)"
          fi

      # ── Tauri: build and upload release artefacts ────────────────────────
      # tauri-apps/tauri-action@v0 is the Tauri v2-compatible release of the action.
      # It finds tauri.conf.json in src-tauri/ automatically (standard layout).
      # tauriScript: "cargo tauri" uses the CLI installed above.
      #
      # ALL platforms: build only here (no releaseId passed to tauri-action).
      # tauri-action's built-in upload targets the CURRENT repo (jura-archive),
      # which is private. Instead, all platforms upload via gh/GitHub API to
      # juralabs/jura-trace using RELEASE_PAT.
      #
      # macOS and Linux: build here, upload in the step that follows.
      # Windows: build here, sign with Azure Trusted Signing, upload signed
      # artefacts manually — see the steps below.
      # ── macOS: build + sign .app only, no DMG yet, no notarisation ──────
      # JTV-184 Phase 5 split: tauri-action signs the .app with codesign
      # --deep but that recursive pass does NOT reach Resources/sidecar-
      # bundle/_internal/*.dylib — verified empirically 2026-05-17 against
      # a clean local build. The 610 nested PyInstaller --onedir dylibs
      # land ad-hoc signed (TeamIdentifier=not set), and hardened-runtime
      # library validation will refuse dlopen on them at first launch
      # ("code signature invalid for use in process").
      #
      # Sequence on macOS:
      #   1. tauri-action builds + signs .app + minisign-signs updater
      #      (--bundles app,updater). NO DMG. NO Apple notarisation.
      #   2. New "Phase 5 per-file sign" step below signs the 610 nested
      #      .dylib/.so deepest-first + the bootloader + re-seals the
      #      .app top level so nested hashes are embedded.
      #   3. Existing spot-check verification gate (passes after step 2).
      #   4. Re-create the updater payload now that the .app is correctly
      #      signed (the .app.tar.gz from step 1 references the broken
      #      .app), and create the DMG from the re-signed .app via
      #      `cargo tauri bundle --bundles dmg,updater`.
      #   5. Codesign the DMG, submit to notarytool, staple .app + DMG.
      #
      # The APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID secrets are NOT
      # passed to tauri-action — that would trigger early notarisation
      # against the broken .app. They are used in the dedicated
      # notarisation step below.
      - name: Build release artefacts (macOS — sign .app only)
        if: matrix.target == 'aarch64-apple-darwin'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE:          ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY:     ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY:          ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: cargo tauri
          # --bundles app — produce only the .app at this stage. DMG +
          # updater payload are regenerated after per-file signing.
          args: --target ${{ matrix.target }} --bundles app

      # ── Linux: unchanged single-shot tauri-action build ──────────────────
      - name: Build release artefacts (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY:          ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: cargo tauri
          # deb + appimage. RPM stays out: rpmbuild xz-compresses the ~607 MB
          # CLIP onnx for over 88 minutes on a 2-core runner, which is what blew
          # the original 120-minute budget.
          #
          # AppImage is back in as of 6 September 2026, because without it Linux
          # cannot auto-update AT ALL. Tauri's Linux updater installs AppImages
          # and cannot install a .deb, so while the pipeline built deb only the
          # updater worker looked for an AppImage that never existed, silently
          # dropped the platform from every manifest, and every Linux user was
          # told they were up to date indefinitely. BL-REL-003 fault 2.
          #
          # It is now required rather than optional: the manifest completeness
          # gate expects darwin-aarch64,linux-x86_64,windows-x86_64, so a
          # release without an AppImage stops at that gate rather than
          # publishing a manifest that quietly omits a platform.
          #
          # The time cost is the honest unknown. The .deb packs the onnx in
          # about 35 seconds; nobody has measured squashfs over the same
          # payload, and Tauri exposes no compression control (its AppImage env
          # vars cover signing only). The job budget is raised to give it room.
          # If it still overruns, the job fails loudly and the release stays a
          # draft, which is the correct direction to fail.
          # -v is load-bearing, not decoration. tauri-bundler runs linuxdeploy
          # through output_ok(), which logs its stderr at log::debug! only and
          # then DISCARDS the captured buffer, raising a bare
          # "failed to run linuxdeploy". At default verbosity you get that line
          # and nothing else, which is exactly what the 7 September failure
          # produced. -v flips the logger to debug and streams linuxdeploy's
          # stderr into the CI log. BL-REL-005.
          args: -v --target ${{ matrix.target }} --bundles deb,appimage

      # If the Linux bundle fails, capture the state that would explain it.
      #
      # The 7 September failure gave one line — "failed to run linuxdeploy" —
      # and nothing to act on, so diagnosing it cost a second 24-minute run
      # that produced the same line. This step makes the next occurrence
      # self-explaining.
      #
      # Disk is the leading hypothesis. The AppImage bundler builds a SECOND
      # full deb-style staging tree at bundle/appimage_deb/, another complete
      # copy of the ~607 MB model and ~192 MB sidecar, on top of the AppDir
      # copy and the deb bundler's own staging: roughly +4.5 GB during the
      # bundle phase. The 36 GB free figure was measured at cleanup time, not
      # at bundling time, so it does not settle the question.
      #
      # An OOM kill would also present as a bare non-zero exit with no stderr,
      # which is why dmesg is here.
      - name: Forensics if the Linux bundle failed
        if: failure() && matrix.target == 'x86_64-unknown-linux-gnu'
        continue-on-error: true
        run: |
          echo "── disk ──"
          df -h / || true
          echo "── memory ──"
          free -m || true
          echo "── OOM kills ──"
          sudo dmesg 2>/dev/null | grep -iE "oom|killed process" | tail -20 || echo "  none found"
          echo "── bundle staging ──"
          for d in appimage appimage_deb deb; do
            p="src-tauri/target/${{ matrix.target }}/release/bundle/$d"
            echo "  $p:"
            du -sh "$p" 2>/dev/null | sed 's/^/    /' || echo "    (absent)"
            ls -la "$p" 2>/dev/null | head -10 | sed 's/^/    /' || true
          done
          echo "── largest paths under target ──"
          du -sh src-tauri/target/*/release/bundle/* 2>/dev/null | sort -h | tail -10 || true

      # ── macOS: per-file sign the nested PyInstaller --onedir tree ────────
      # Tauri's --deep does not reach Resources/sidecar-bundle/_internal/ in
      # our local test. Sign every .dylib + .so deepest-first, then the
      # bootloader, then re-seal the .app top so the outer signature embeds
      # the new nested hashes. The keychain is already configured by the
      # previous tauri-action step (APPLE_CERTIFICATE was imported there).
      - name: Phase 5 — per-file sign nested sidecar-bundle code (macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/aarch64-apple-darwin/release/bundle"
          app_path=$(find "$bundle_dir/macos" -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$app_path" ]; then
            echo "::error::No .app found under $bundle_dir/macos"
            exit 1
          fi
          sidecar_root="$app_path/Contents/Resources/sidecar-bundle"
          if [ ! -d "$sidecar_root" ]; then
            echo "::error::sidecar-bundle not in .app — tauri.conf.json resources glob may be wrong"
            exit 1
          fi
          count=0
          while IFS= read -r f; do
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp "$f" >/dev/null 2>&1
            count=$((count + 1))
          done < <(find "$sidecar_root" -type f \( -name "*.so" -o -name "*.dylib" \) | sort -r)
          echo "Per-file signed $count nested .so/.dylib files."
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp "$sidecar_root/jura-sidecar"
          echo "Signed bootloader."
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp "$app_path"
          echo "Re-sealed .app top level."
          codesign --verify --deep --strict --verbose=2 "$app_path" 2>&1 | tail -3

      # ── macOS Phase 5: spot-check sidecar-bundle nested signing ──────────
      # Tauri-action signs the .app with codesign --force --deep, which should
      # recursively re-sign nested Mach-O code under Resources/sidecar-bundle/
      # with Developer ID Application: Jura Labs CIC (Y82C4P9L7F). On the
      # Sprint-31 local-build dry-run, that recursive pass left libpython +
      # ~600 nested .dylib/.so as ad-hoc signed (TeamIdentifier=not set),
      # causing hardened-runtime library validation to refuse dlopen at
      # runtime — "code signature invalid for use in process".
      #
      # This step spot-checks 5 nested files. If any are NOT signed by
      # Y82C4P9L7F we emit a warning AND fail the build, so the first CI
      # cut surfaces the gap rather than shipping a broken .app. Remediation
      # if this fires: add an explicit per-file codesign loop here (set up
      # the keychain ourselves before tauri-action, sign deepest-first, then
      # re-seal the .app top level — see JTV-184 Phase 5 spike notes).
      - name: Phase 5 — verify sidecar-bundle nested code signing (macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/aarch64-apple-darwin/release/bundle"
          app_path=$(find "$bundle_dir/macos" -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$app_path" ]; then
            echo "ERROR: no .app found under $bundle_dir/macos"
            exit 1
          fi
          sidecar_root="$app_path/Contents/Resources/sidecar-bundle"
          if [ ! -d "$sidecar_root" ]; then
            echo "ERROR: sidecar-bundle not bundled into .app — Tauri resources glob may be wrong"
            ls -la "$app_path/Contents/Resources/" || true
            exit 1
          fi
          echo "--- sidecar-bundle in .app ---"
          du -sh "$sidecar_root"
          echo
          # Spot-check 5 random nested binaries
          failed=0
          checked=0
          while IFS= read -r f; do
            checked=$((checked + 1))
            ident=$(codesign --display --verbose=2 "$f" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2}' | head -1)
            if [ "$ident" != "Y82C4P9L7F" ]; then
              echo "MIS-SIGNED: $f  Team='$ident'  (expected Y82C4P9L7F)"
              failed=$((failed + 1))
            else
              echo "OK: $(basename "$f")  Team=$ident"
            fi
          done < <(find "$sidecar_root" -type f \( -name "*.dylib" -o -name "*.so" \) | head -5)
          echo
          # Bootloader check
          boot_ident=$(codesign --display --verbose=2 "$sidecar_root/jura-sidecar" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2}' | head -1)
          echo "Bootloader: Team=$boot_ident"
          [ "$boot_ident" != "Y82C4P9L7F" ] && failed=$((failed + 1))
          echo
          if [ "$failed" -gt 0 ]; then
            echo "::error::Phase 5 nested signing check failed — $failed of $((checked + 1)) sampled files not signed by Y82C4P9L7F."
            echo "::error::The per-file sign step above should have made this pass; check its output."
            exit 1
          fi
          echo "Phase 5 nested signing verification PASSED."

      # ── macOS: regenerate DMG + updater payload from re-signed .app ─────
      # The updater .app.tar.gz created in the first tauri-action call
      # references the broken-nested-signing .app. Regenerate it now that
      # the .app is correctly signed. `cargo tauri bundle --bundles
      # dmg,updater` accepts the existing .app on disk and bundles only
      # the requested targets without re-signing the .app itself.
      - name: Phase 5 — regenerate DMG + updater payload (macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          TAURI_SIGNING_PRIVATE_KEY:          ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cargo tauri bundle --bundles dmg,updater --target aarch64-apple-darwin
          echo "--- regenerated bundle contents ---"
          ls -la src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/ || true
          ls -la src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ || true

      # ── macOS: codesign the DMG ─────────────────────────────────────────
      - name: Phase 5 — codesign DMG (macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/aarch64-apple-darwin/release/bundle"
          dmg=$(find "$bundle_dir/dmg" -maxdepth 1 -name "*.dmg" | head -1)
          if [ -z "$dmg" ]; then
            echo "::error::No DMG found after bundle regenerate"
            exit 1
          fi
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$dmg"
          codesign --verify --verbose=2 "$dmg" 2>&1 | tail -3

      # ── macOS: notarise DMG + staple .app and DMG ───────────────────────
      # notarytool submission against the DMG implicitly notarises the
      # .app inside. Stapling attaches the notarisation ticket to the
      # artefact so Gatekeeper can verify it offline at install time.
      # Both .app and DMG get stapled so the .app remains valid if a user
      # extracts it from the DMG (and the .app.tar.gz updater payload
      # generated above also benefits from the stapled .app).
      - name: Phase 5 — notarise + staple (macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          APPLE_ID:       ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID:  ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/aarch64-apple-darwin/release/bundle"
          dmg=$(find "$bundle_dir/dmg" -maxdepth 1 -name "*.dmg" | head -1)
          app_path=$(find "$bundle_dir/macos" -maxdepth 1 -name "*.app" -type d | head -1)
          echo "Submitting DMG to Apple notarytool (this can take 1–10 min)..."
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          echo "Stapling notarisation ticket to DMG..."
          xcrun stapler staple "$dmg"
          echo "Stapling notarisation ticket to .app..."
          xcrun stapler staple "$app_path"
          echo "--- verification ---"
          xcrun stapler validate "$dmg"
          xcrun stapler validate "$app_path"
          spctl --assess --verbose=2 --type install "$dmg" 2>&1 | tail -3

      # ── Empty-signature gate (macOS / Linux) ────────────────────────────
      # Fails the build if any updater payload is missing its .sig file
      # or has a zero-byte .sig. Tauri v2 with createUpdaterArtifacts:true
      # produces:
      #   macOS  — *.app.tar.gz  + *.app.tar.gz.sig  (tar archive)
      #   Linux  — *.AppImage    + *.AppImage.sig     (the AppImage itself,
      #            NOT a separate .AppImage.tar.gz — that is the v1Compatible
      #            format; v2 signs the AppImage directly)
      # This catches the failure mode where TAURI_SIGNING_PRIVATE_KEY is not
      # configured in repo Secrets: tauri-action emits empty .sig files and
      # the Tauri updater silently refuses to apply any update.
      - name: Verify updater signatures (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          sig_problems=0
          # macOS: *.app.tar.gz; Linux: *.AppImage (v2 format, not .tar.gz)
          while IFS= read -r payload; do
            sig="${payload}.sig"
            if [ ! -f "$sig" ]; then
              echo "ERROR: missing .sig for ${payload}"
              sig_problems=$((sig_problems + 1))
            elif [ ! -s "$sig" ]; then
              echo "ERROR: empty .sig for ${payload} (zero bytes)"
              sig_problems=$((sig_problems + 1))
            else
              echo "OK: $(basename "${sig}") ($(wc -c < "${sig}") bytes)"
            fi
          done < <(find "$bundle_dir" \( -name "*.app.tar.gz" -o -name "*.AppImage" \) -maxdepth 4 2>/dev/null)
          if [ "$sig_problems" -gt 0 ]; then
            echo "FAIL: ${sig_problems} updater signature problem(s)."
            echo "Verify TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            echo "are set in repo Secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      # Upload macOS and Linux artefacts to juralabs/jura-trace via RELEASE_PAT.
      #
      # Bundle output directories (Tauri v2, createUpdaterArtifacts: true):
      #   macOS: src-tauri/target/aarch64-apple-darwin/release/bundle/
      #     dmg/*.dmg
      #     macos/*.app.tar.gz          ← updater archive (tar of the .app)
      #     macos/*.app.tar.gz.sig      ← minisign updater signature
      #   Linux: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/
      #     appimage/*.AppImage         ← user installer AND the updater target
      #     appimage/*.AppImage.sig     ← minisign updater signature
      #     deb/*.deb  /  deb/*.deb.sig
      #     rpm/*.rpm  /  rpm/*.rpm.sig  (if built)
      #
      # NOTE: In Tauri v2 (createUpdaterArtifacts: true) the updater signs
      # the AppImage directly — there is NO separate .AppImage.tar.gz.
      # That archive format belongs to createUpdaterArtifacts: "v1Compatible".
      #
      # Naming policy:
      #   Updater payloads (.app.tar.gz, .app.tar.gz.sig, .AppImage.sig,
      #   .deb.sig, .rpm.sig) → uploaded RAW — the manifest job and the
      #   Cloudflare worker locate them by their Tauri-produced suffix.
      #   User-facing installers (.dmg, .AppImage, .deb) → copied to a
      #   friendly JuraTrace-<ver>-<platform>.<ext> name before upload so
      #   the release-body download links resolve.
      #
      # gh release upload --clobber is idempotent — safe on re-runs.
      - name: Upload release artefacts to jura-trace (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          # github.ref_name resolves to the BRANCH (e.g. "main") on
          # workflow_dispatch runs, NOT to the tag input.  Prefer the
          # workflow_dispatch input when present, fall back to ref_name
          # for tag-push runs (where ref_name is the tag).
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"

          echo "Scanning bundle directory: $bundle_dir"
          ls -lR "$bundle_dir" || echo "(bundle directory not found — build may have failed)"

          # Strip leading "v" from the tag to build friendly installer names.
          # e.g. tag="v1.0.0" → ver="1.0.0"
          ver="${tag#v}"

          # Collect all installer and updater artefact types produced by Tauri v2.
          # Uses a while-read loop instead of mapfile for macOS bash 3.2 compat.
          find "$bundle_dir" \
            \( \
              -name "*.dmg" \
              -o -name "*.app.tar.gz" \
              -o -name "*.app.tar.gz.sig" \
              -o -name "*.AppImage" \
              -o -name "*.AppImage.sig" \
              -o -name "*.deb" \
              -o -name "*.deb.sig" \
              -o -name "*.rpm" \
              -o -name "*.rpm.sig" \
            \) \
            -maxdepth 4 2>/dev/null | sort | while IFS= read -r f; do
            fname="$(basename "$f")"
            case "$fname" in
              *.app.tar.gz|*.app.tar.gz.sig|*.AppImage.sig|*.deb.sig|*.rpm.sig)
                # Updater sig files and macOS updater archive: upload raw.
                # Manifest job locates them by their Tauri-produced suffix.
                # The AppImage.sig stays raw so the manifest job can match it
                # against the friendly-named AppImage via asset-name lookup.
                echo "Uploading (raw) $fname ..."
                gh release upload "$tag" "$f" \
                  --repo juralabs/jura-trace \
                  --clobber
                ;;
              *.dmg)
                friendly="JuraTrace-${ver}-macOS-AppleSilicon.dmg"
                tmp_dir="$(mktemp -d)"
                cp "$f" "${tmp_dir}/${friendly}"
                echo "Uploading (friendly) ${friendly} ..."
                gh release upload "$tag" "${tmp_dir}/${friendly}" \
                  --repo juralabs/jura-trace \
                  --clobber
                rm -rf "$tmp_dir"
                ;;
              *.AppImage)
                friendly="JuraTrace-${ver}-Linux-x86_64.AppImage"
                tmp_dir="$(mktemp -d)"
                cp "$f" "${tmp_dir}/${friendly}"
                echo "Uploading (friendly) ${friendly} ..."
                gh release upload "$tag" "${tmp_dir}/${friendly}" \
                  --repo juralabs/jura-trace \
                  --clobber
                rm -rf "$tmp_dir"
                ;;
              *.deb)
                friendly="JuraTrace-${ver}-Linux-x86_64.deb"
                tmp_dir="$(mktemp -d)"
                cp "$f" "${tmp_dir}/${friendly}"
                echo "Uploading (friendly) ${friendly} ..."
                gh release upload "$tag" "${tmp_dir}/${friendly}" \
                  --repo juralabs/jura-trace \
                  --clobber
                rm -rf "$tmp_dir"
                ;;
              *.rpm)
                # .rpm: upload raw (no friendly rename policy yet).
                echo "Uploading (raw) $fname ..."
                gh release upload "$tag" "$f" \
                  --repo juralabs/jura-trace \
                  --clobber
                ;;
            esac
          done

          # Verify at least one installer was found (re-run find for the check
          # since the while loop runs in a subshell and cannot export a counter).
          found=$(find "$bundle_dir" \( -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) -maxdepth 4 2>/dev/null | head -1)
          if [ -z "$found" ]; then
            echo "ERROR: No release artefacts found under $bundle_dir"
            exit 1
          fi
          echo "Upload complete."

      # Windows: build only — do not pass releaseId so tauri-action does not
      # attempt to upload the unsigned artefacts to the GitHub Release.
      # Signing and upload are handled by the two steps that follow.
      - name: Build release artefacts (Windows, unsigned)
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── Windows Authenticode signing ──────────────────────────────────
          # Authenticode signing is performed by Azure Trusted Signing (step
          # below). TAURI_SIGNING_PRIVATE_KEY is separate — it signs the
          # Tauri updater payload (.msi.zip) with the minisign key whose
          # public half lives in tauri.conf.json's plugins.updater.pubkey.
          # Without these env vars, the updater .sig is empty and the Tauri
          # updater silently refuses to apply any update — a critical
          # security gap. The "Verify updater signatures" step below
          # catches missing/empty signatures before upload.
          TAURI_SIGNING_PRIVATE_KEY:          ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # releaseId intentionally omitted — unsigned binaries must not be
          # published to the GitHub Release; only the signed copies go up.
          tauriScript: cargo tauri
          args: --target ${{ matrix.target }}

      # ── Updater signatures: generated AFTER Azure signing ───────────────
      # The empty-signature gate used to live HERE, before Azure Trusted
      # Signing. That was wrong and it broke every Windows auto-update.
      # tauri-action minisigns the MSI, this gate verified it, and then the
      # Azure step below overwrote the MSI in place with its countersigned
      # version. The .sig therefore covered bytes that no longer existed,
      # and minisign verification failed on every client.
      #
      # The re-sign and the gate now run after Azure, further down, on the
      # bytes that actually ship. See "Re-sign the updater payloads" below.

      # ── Windows: Azure Trusted Signing ───────────────────────────────────
      # Signs all .exe and .msi files produced by tauri-action in the Tauri
      # bundle output directory with the Azure Trusted Signing certificate:
      #   Account ID: a7e35def-628b-4980-8785-2e535f709418
      #
      # azure/trusted-signing-action authenticates to Azure using the OIDC
      # service principal credentials stored in GitHub Secrets. It calls the
      # Azure Trusted Signing REST API (endpoint: AZURE_SIGNING_ENDPOINT) and
      # countersigns each matched binary in place — the original files are
      # overwritten with their signed versions.
      #
      # Required GitHub Secrets (add under Settings > Secrets > Actions):
      #   AZURE_TENANT_ID        — Azure AD tenant GUID
      #   AZURE_CLIENT_ID        — Service principal application GUID
      #   AZURE_CLIENT_SECRET    — Service principal client secret
      #   AZURE_SIGNING_ENDPOINT — e.g. https://eus.codesigning.azure.net
      #   AZURE_SIGNING_ACCOUNT  — Trusted Signing account name
      #   AZURE_CERT_PROFILE     — Certificate profile name
      #
      # file-digest / timestamp-digest: SHA256 is the current Windows standard.
      # timestamp-rfc3161: Microsoft's public TSA — free, no throttling for
      # normal release volumes.
      #
      # files-folder-depth 4 covers the nested Tauri bundle output:
      #   release/bundle/msi/          (depth 3 from release/)
      #   release/bundle/nsis/         (depth 3 from release/)
      # Setting depth 4 provides a safe margin if sub-directories are added.
      - name: Sign Windows binaries with Azure Trusted Signing
        if: runner.os == 'Windows'
        uses: azure/trusted-signing-action@07c81171dd46a04e1b9f382b6c693815828bbbf7 # v0.5.0
        with:
          azure-tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret:   ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint:              ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name:     ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder:          src-tauri/target/${{ matrix.target }}/release/bundle
          files-folder-filter:   exe,msi
          files-folder-depth:    4
          file-digest:           SHA256
          timestamp-rfc3161:     http://timestamp.acs.microsoft.com
          timestamp-digest:      SHA256

      # ── Re-sign the updater payloads over the FINAL bytes ───────────────
      # Azure Trusted Signing overwrites each installer in place, so any
      # minisign signature produced before it is now stale. Regenerate the
      # .sig files here, after the last mutation and before upload.
      #
      # This is the same lesson the sidecar signing already encodes further
      # up this file: sign after the artefact is final, never before.
      - name: Re-sign the updater payloads (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY:          ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $bundle = "src-tauri\target\${{ matrix.target }}\release\bundle"
          $installers = @(
            Get-ChildItem -Path $bundle -Recurse -Filter "*.msi"       -ErrorAction SilentlyContinue
            Get-ChildItem -Path $bundle -Recurse -Filter "*-setup.exe" -ErrorAction SilentlyContinue
          ) | Where-Object { $_ -ne $null }
          if ($installers.Count -eq 0) {
            Write-Error "ERROR: no installer found under $bundle to re-sign."
            exit 1
          }
          foreach ($t in $installers) {
            $sig = "$($t.FullName).sig"
            # Remove the stale signature first, so a failure to regenerate
            # cannot leave the old one in place looking plausible.
            if (Test-Path $sig) { Remove-Item $sig -Force }
            Write-Host "Signing $($t.Name) ..."
            cargo tauri signer sign "$($t.FullName)"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "ERROR: cargo tauri signer sign failed for $($t.Name)"
              exit 1
            }
          }

      # ── Empty-signature and freshness gate (Windows) ─────────────────────
      # Runs LAST, on the bytes that ship. Checks each .sig exists, is
      # non-empty, and is NEWER than the installer it signs. That last
      # assertion is the one that encodes the bug: a signature older than
      # its artefact cannot possibly describe it.
      - name: Verify updater signatures (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "src-tauri\target\${{ matrix.target }}\release\bundle"
          $problems = 0
          $installers = @(
            Get-ChildItem -Path $bundle -Recurse -Filter "*.msi"       -ErrorAction SilentlyContinue
            Get-ChildItem -Path $bundle -Recurse -Filter "*-setup.exe" -ErrorAction SilentlyContinue
          ) | Where-Object { $_ -ne $null }
          if ($installers.Count -eq 0) {
            Write-Error "ERROR: No MSI or NSIS installer found under $bundle — build may have failed."
            exit 1
          }
          foreach ($t in $installers) {
            $sigPath = "$($t.FullName).sig"
            if (-not (Test-Path $sigPath)) {
              Write-Error "ERROR: missing .sig for $($t.Name)"
              $problems++
              continue
            }
            $sig = Get-Item $sigPath
            if ($sig.Length -eq 0) {
              Write-Error "ERROR: empty .sig for $($t.Name) (zero bytes)"
              $problems++
            } elseif ($sig.LastWriteTimeUtc -lt $t.LastWriteTimeUtc) {
              Write-Error "ERROR: .sig for $($t.Name) is OLDER than the installer. The artefact was modified after it was signed, so this signature cannot verify. This is what broke every Windows auto-update from 22 May 2026."
              $problems++
            } else {
              Write-Host "OK: $($sig.Name) ($($sig.Length) bytes, signed after the installer)"
            }
          }
          if ($problems -gt 0) {
            Write-Error "FAIL: $problems updater signature problem(s)."
            exit 1
          }

      # Upload the signed Windows artefacts to the draft release on
      # juralabs/jura-trace (the PUBLIC releases repo) via RELEASE_PAT.
      #
      # Tauri v2 (createUpdaterArtifacts: true) produces for a Windows x64 build:
      #   bundle/msi/Jura Trace_<ver>_x64_en-US.msi
      #   bundle/msi/Jura Trace_<ver>_x64_en-US.msi.sig        (minisign updater sig)
      #   bundle/nsis/Jura Trace_<ver>_x64-setup.exe
      #   bundle/nsis/Jura Trace_<ver>_x64-setup.exe.sig       (minisign updater sig)
      #
      # NOTE: The v1Compatible format produced .nsis.zip / .nsis.zip.sig archives.
      # In v2 format the .sig is a detached signature on the installer itself.
      # The updater downloads the installer directly; the .sig is read inline by
      # the manifest job to populate platforms.windows-x86_64.signature.
      #
      # gh release upload with --clobber silently replaces an asset that
      # already exists (idempotent re-runs after a partial failure).
      # On workflow_dispatch, github.ref_name is the branch ("main"), not
      # the tag input — fall back via the tag input first.
      - name: Upload signed Windows artefacts to jura-trace
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # RELEASE_PAT has repo scope on juralabs/jura-trace — gh uses this env var.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          $tag = if ("${{ github.event.inputs.tag }}") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          # Strip leading "v" to build friendly installer names.
          $ver = $tag -replace '^v', ''
          $bundle = "src-tauri\target\${{ matrix.target }}\release\bundle"

          # Collect signed installers and their detached .sig files.
          # Separate globs keep the intent explicit.
          # v2 format: .msi + .msi.sig, -setup.exe + -setup.exe.sig
          $msiFiles    = Get-ChildItem "$bundle\msi\*.msi"           -ErrorAction SilentlyContinue
          $msiSigs     = Get-ChildItem "$bundle\msi\*.msi.sig"       -ErrorAction SilentlyContinue
          $setupExes   = Get-ChildItem "$bundle\nsis\*-setup.exe"    -ErrorAction SilentlyContinue
          $setupSigs   = Get-ChildItem "$bundle\nsis\*-setup.exe.sig" -ErrorAction SilentlyContinue

          $allFiles = @($msiFiles) + @($msiSigs) + @($setupExes) + @($setupSigs) |
                      Where-Object { $_ -ne $null }

          if ($allFiles.Count -eq 0) {
            Write-Error "No Windows release artefacts found under $bundle"
            exit 1
          }

          $tmpDir = [System.IO.Path]::Combine([System.IO.Path]::GetTempPath(), [System.IO.Path]::GetRandomFileName())
          New-Item -ItemType Directory -Path $tmpDir | Out-Null

          foreach ($f in $allFiles) {
            # Naming policy:
            #   .msi.sig and -setup.exe.sig → upload raw (manifest job reads
            #     them by suffix to populate platforms.windows-x86_64.signature).
            #   .msi       → friendly JuraTrace-<ver>-Windows-x64.msi
            #   -setup.exe → friendly JuraTrace-<ver>-Windows-x64-setup.exe
            if ($f.Name -match '\.msi\.sig$' -or $f.Name -match '-setup\.exe\.sig$') {
              Write-Host "Uploading (raw) $($f.Name) ..."
              gh release upload $tag "$($f.FullName)" --repo juralabs/jura-trace --clobber
            } elseif ($f.Name -match '\.msi$') {
              $friendly = "JuraTrace-$ver-Windows-x64.msi"
              $dest = Join-Path $tmpDir $friendly
              Copy-Item $f.FullName $dest
              Write-Host "Uploading (friendly) $friendly ..."
              gh release upload $tag $dest --repo juralabs/jura-trace --clobber
            } elseif ($f.Name -match '-setup\.exe$') {
              $friendly = "JuraTrace-$ver-Windows-x64-setup.exe"
              $dest = Join-Path $tmpDir $friendly
              Copy-Item $f.FullName $dest
              Write-Host "Uploading (friendly) $friendly ..."
              gh release upload $tag $dest --repo juralabs/jura-trace --clobber
            } else {
              Write-Host "Uploading (raw) $($f.Name) ..."
              gh release upload $tag "$($f.FullName)" --repo juralabs/jura-trace --clobber
            }
          }

          Remove-Item -Recurse -Force $tmpDir

  # ── Phase 3: Publish the draft release once all platform builds succeed ──
  publish-release:
    name: Publish Release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    # Run even when the build matrix has failures (e.g. the known macOS Phase 5
    # codesign failure — macOS ships via local build and manual upload).
    # The SHA256SUMS step fetches whatever assets ARE on the draft release;
    # a partial release (Windows + Linux only) still needs SHA256SUMS.txt.
    # Security is preserved: only assets actually present on the release are
    # hashed — a missing platform produces a warning, not silence.
    if: ${{ always() && needs.create-release.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'failure') }}
    # Protect production release publishing behind an environment approval gate.
    # Configure the "production" environment at:
    #   Settings > Environments > production > Required reviewers
    environment: production
    steps:
      # tauri-action uploads installer artefacts directly to the draft GitHub
      # Release (not as workflow artefacts). We therefore download them here
      # via the GitHub Releases API, hash each one with sha256sum, assemble
      # SHA256SUMS.txt, and upload it as an additional release asset — all
      # while the release is still a draft, before we flip it to published.
      - name: Generate and upload SHA-256 checksums
        # Uses RELEASE_PAT to read and write assets on juralabs/jura-trace.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        with:
          github-token: ${{ secrets.RELEASE_PAT }}
          script: |
            const fs   = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            const releaseId = parseInt(process.env.RELEASE_ID, 10);

            // Fetch the list of assets already attached to the draft release
            // on juralabs/jura-trace (the public releases repo).
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: 'juralabs',
              repo: 'jura-trace',
              release_id: releaseId,
              per_page: 100,
            });

            // Only hash installer artefacts — skip any existing SHA256SUMS.txt
            // (idempotent re-runs) and update manifests (*.json).
            const installerExts = ['.dmg', '.msi', '.exe', '.AppImage', '.deb', '.tar.gz'];
            const toHash = assets.filter(a =>
              installerExts.some(ext => a.name.endsWith(ext))
            );

            if (toHash.length === 0) {
              core.warning('No installer artefacts found on the release — SHA256SUMS.txt will be empty.');
            }

            // Download each artefact into a temporary directory and hash it.
            // The GitHub asset download URL requires the Accept header to redirect
            // to the actual binary; we use the authenticated octokit method so the
            // RELEASE_PAT is forwarded automatically.
            const tmpDir = '/tmp/release-assets';
            fs.mkdirSync(tmpDir, { recursive: true });

            const lines = [];
            for (const asset of toHash) {
              console.log(`Downloading ${asset.name} (${asset.size} bytes)...`);

              // getReleaseAsset with Accept: application/octet-stream returns the
              // raw binary. The octokit response data is a Buffer in Node.js.
              const response = await github.rest.repos.getReleaseAsset({
                owner: 'juralabs',
                repo: 'jura-trace',
                asset_id: asset.id,
                headers: { Accept: 'application/octet-stream' },
              });

              const filePath = path.join(tmpDir, asset.name);
              // response.data is an ArrayBuffer; convert to Buffer for writeFileSync.
              fs.writeFileSync(filePath, Buffer.from(response.data));

              // sha256sum produces "<hash>  <filename>" (two spaces — standard format).
              // Run from tmpDir so the output contains only the bare filename, not
              // the full path, matching what users will see in the release.
              const hash = execSync(`sha256sum "${asset.name}"`, { cwd: tmpDir })
                .toString()
                .trim();
              lines.push(hash);
              console.log(hash);
            }

            // Write the combined checksum file and upload it to the release.
            const sumsPath = path.join(tmpDir, 'SHA256SUMS.txt');
            fs.writeFileSync(sumsPath, lines.join('\n') + '\n');

            // Upload via the gh CLI (GH_TOKEN = RELEASE_PAT). The octokit
            // uploadReleaseAsset path logged success but did NOT attach the
            // asset to the draft release (caught in the rc.32 smoke). gh
            // release upload is the same proven path the installer assets use;
            // --clobber makes it idempotent on re-runs (replaces the manual
            // delete-then-upload above).
            execSync(
              `gh release upload "${process.env.RELEASE_TAG}" "${sumsPath}" --repo juralabs/jura-trace --clobber`,
              { stdio: 'inherit' }
            );
            console.log('Uploaded SHA256SUMS.txt');

      # Generate the Tauri auto-updater manifest and upload it to the release.
      #
      # Tauri's updater expects a JSON manifest at the URL configured in
      # tauri.conf.json plugins.updater.endpoints.  The format requires a
      # "version", "pub_date", "notes", and a "platforms" map where each
      # key is a Rust target triple (e.g. "darwin-aarch64") and the value
      # carries a "url" pointing to the .tar.gz update archive and an
      # optional "signature" (minisign) for signed builds.
      #
      # Beta channel logic:
      #   Stable tags  (v1.0.0)           → latest.json    (auto-updates all stable users)
      #   Beta tags    (v1.0.0-beta.1)    → latest-beta.json (auto-updates beta-channel users only)
      #   RC tags      (v1.0.0-rc.1)      → no manifest written (manual download only)
      #   Alpha tags   (v1.0.0-alpha.1)   → no manifest written (manual download only)
      #
      # In tauri.conf.json, stable builds use:
      #   "endpoints": [".../releases/latest/download/latest.json"]
      # Beta builds (tauri.beta.conf.json) use:
      #   "endpoints": [".../releases/latest/download/latest-beta.json"]
      #
      # Platform keys must match what Tauri's updater expects:
      #   darwin-aarch64  — macOS Apple Silicon
      #   linux-x86_64    — Linux
      #   windows-x86_64  — Windows
      #
      # darwin-x86_64 (Intel Mac) is omitted — Intel users run the ARM build
      # under Rosetta 2. Re-add when universal binaries are built (Sprint 19).
      #
      # For unsigned builds, "signature" is an empty string.  When code
      # signing is introduced (Sprint 19), each .tar.gz/.zip will have a
      # companion .sig file uploaded by tauri-action; read those here.
      - name: Generate and upload update manifest
        id: manifest
        # Uses RELEASE_PAT to read and write assets on juralabs/jura-trace.
        # Sets the following outputs (consumed by the JTV-146
        # juralabs.org SCP step that follows):
        #   wrote_manifest  — "true" when this step produced a manifest;
        #                     "false" for RC / alpha tags that skip
        #                     manifest generation entirely
        #   manifest_name   — "latest.json" or "latest-beta.json"
        #   manifest_path   — runner-local path of the manifest file
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          github-token: ${{ secrets.RELEASE_PAT }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const releaseId = parseInt(process.env.RELEASE_ID, 10);

            // Fetch the release metadata (tag name, body, created_at)
            // from juralabs/jura-trace (the public releases repo).
            const { data: release } = await github.rest.repos.getRelease({
              owner: 'juralabs',
              repo: 'jura-trace',
              release_id: releaseId,
            });

            const tag = release.tag_name; // e.g. "v0.9.0" or "v1.0.0-beta.1"

            // Determine which manifest filename to write (or skip entirely).
            //   Stable:        latest.json
            //   Beta:          latest-beta.json
            //   Smoke-test:    latest-smoke.json (JTV-155 end-to-end validation
            //                  of the manifest pipeline before v1.0.0 launch.
            //                  Tag pattern: vX.Y.Z-rc.NN-smoke-YYYYMMDD.)
            //   RC/Alpha:      skip (manual download only, do not push updates
            //                  to any client)
            const isBeta      = /-(beta)\./.test(tag);
            const isSmokeTest = /-smoke-\d{8}$/.test(tag);
            const isRcOrAlpha = /-(rc|alpha)\./.test(tag);

            if (isRcOrAlpha && !isSmokeTest) {
              console.log(`Tag ${tag} is an RC or alpha pre-release. No update manifest will be written.`);
              console.log('RC/alpha builds are available only via manual GitHub release download.');
              core.setOutput('wrote_manifest', 'false');
              return;
            }

            const manifestName = isSmokeTest
              ? 'latest-smoke.json'
              : (isBeta ? 'latest-beta.json' : 'latest.json');
            console.log(`Tag ${tag} → writing ${manifestName}`);

            // Fetch all assets attached to the draft release on jura-trace.
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: 'juralabs',
              repo: 'jura-trace',
              release_id: releaseId,
              per_page: 100,
            });

            const version = tag.replace(/^v/, '');           // e.g. "0.9.0" or "1.0.0-beta.1"
            // baseUrl points to juralabs/jura-trace so auto-update download URLs
            // resolve to the public repo that users can access.
            const baseUrl = `https://github.com/juralabs/jura-trace/releases/download/${tag}`;

            // Map each Tauri updater platform key to the expected asset suffixes.
            //
            // Tauri v2 (createUpdaterArtifacts: true) produces:
            //   macOS   → <AppName>_<ver>_aarch64.app.tar.gz      (updater downloads this)
            //             <AppName>_<ver>_aarch64.app.tar.gz.sig  (minisign)
            //   Linux   → <AppName>_<ver>_amd64.AppImage          (updater downloads this)
            //             <AppName>_<ver>_amd64.AppImage.sig      (minisign, raw Tauri name)
            //             NOTE: in v2 format there is NO .AppImage.tar.gz.
            //   Windows → <AppName>_<ver>_x64_en-US.msi           (updater downloads this)
            //             <AppName>_<ver>_x64_en-US.msi.sig       (minisign)
            //
            // The upload step renames the user-facing installers (.dmg, .AppImage, .deb,
            // .msi, -setup.exe) to friendly JuraTrace-<ver>-<platform>.<ext> names.
            // The .sig files are uploaded RAW under their original Tauri names.
            //
            // To locate both the URL asset (possibly friendly-renamed) and the .sig asset
            // (always raw), each platform entry carries:
            //   urlSuffix — suffix to find the downloadable installer
            //   sigSuffix — suffix to find the raw .sig on the release
            //
            // darwin-x86_64 omitted — Intel Mac users run under Rosetta 2.
            const platformMap = {
              'darwin-aarch64': {
                // Tauri names the macOS updater archive "<productName>.app.tar.gz"
                // (e.g. "Jura Trace.app.tar.gz") with no version or arch in the
                // name, uploaded raw. Match the bare suffix, not "_aarch64...".
                urlSuffix: '.app.tar.gz',
                sigSuffix: '.app.tar.gz.sig',
              },
              'linux-x86_64': {
                // The AppImage is uploaded as a friendly name but the .sig is raw.
                // We use the friendly name's suffix for the URL and the raw Tauri
                // suffix for the sig.
                urlSuffix: '.AppImage',
                sigSuffix: '_amd64.AppImage.sig',
              },
              'windows-x86_64': {
                // Use the MSI as the updater target (preferred over the NSIS exe for
                // enterprise environments; both carry valid .sig files).
                urlSuffix: '.msi',
                sigSuffix: '.msi.sig',
              },
            };

            const platforms = {};

            for (const [platform, cfg] of Object.entries(platformMap)) {
              // Find the downloadable asset by URL suffix (case-insensitive).
              const asset = assets.find(a =>
                a.name.toLowerCase().endsWith(cfg.urlSuffix.toLowerCase())
              );

              if (!asset) {
                core.warning(`No asset found for platform ${platform} (expected URL suffix: ${cfg.urlSuffix})`);
                continue;
              }

              // Find the .sig asset by its own suffix (raw Tauri name, not asset.name + '.sig',
              // because the installer may have been friendly-renamed while the sig was not).
              const sigAsset = assets.find(a =>
                a.name.toLowerCase().endsWith(cfg.sigSuffix.toLowerCase())
              );
              const signature = sigAsset ? (await (async () => {
                const sigResp = await github.rest.repos.getReleaseAsset({
                  owner: 'juralabs',
                  repo: 'jura-trace',
                  asset_id: sigAsset.id,
                  headers: { Accept: 'application/octet-stream' },
                });
                return Buffer.from(sigResp.data).toString('utf-8').trim();
              })()) : '';

              if (!sigAsset) {
                core.warning(`No .sig found for platform ${platform} (expected sig suffix: ${cfg.sigSuffix}) — signature will be empty string`);
              }

              platforms[platform] = {
                url: `${baseUrl}/${asset.name}`,
                signature,
              };
            }

            // Produce the manifest.  "notes" is populated from the release body
            // (which the create-release job already set from CHANGELOG.md).
            const manifest = {
              version: `v${version}`,
              notes:   release.body || `Jura Trace ${tag}`,
              pub_date: release.created_at,
              platforms,
            };

            const manifestJson = JSON.stringify(manifest, null, 2);
            console.log(`${manifestName}:\n`, manifestJson);

            const tmpPath = `/tmp/${manifestName}`;
            fs.writeFileSync(tmpPath, manifestJson);

            // Remove any pre-existing manifest asset with this name (idempotent re-runs).
            const existingManifest = assets.find(a => a.name === manifestName);
            if (existingManifest) {
              await github.rest.repos.deleteReleaseAsset({
                owner: 'juralabs',
                repo: 'jura-trace',
                asset_id: existingManifest.id,
              });
            }

            await github.rest.repos.uploadReleaseAsset({
              owner: 'juralabs',
              repo: 'jura-trace',
              release_id: releaseId,
              name: manifestName,
              data: fs.readFileSync(tmpPath),
            });
            console.log(`Uploaded ${manifestName}`);

            // Expose for the JTV-146 SCP-to-juralabs.org step that follows.
            core.setOutput('wrote_manifest', 'true');
            core.setOutput('manifest_name', manifestName);
            core.setOutput('manifest_path', tmpPath);
            core.setOutput('platform_keys', Object.keys(platforms).sort().join(','));

      # ── Completeness gate before the manifest reaches the live endpoint ──
      # A manifest missing a platform does not fail. It tells every client on
      # that platform, indefinitely and with no error anywhere, that they are
      # up to date. That is how Linux disappeared for eleven weeks.
      #
      # This job deliberately runs when the build matrix has failures, because
      # the macOS job fails by design and macOS ships by local build and
      # manual upload. The consequence nobody guarded: an incomplete manifest
      # could be pushed to juralabs.org, which is the PRIMARY updater
      # endpoint, before the DMG was uploaded.
      #
      # The GitHub release asset is fine to write early, since the release is
      # still a draft and the flip to published is already guarded on build
      # success further down. The live endpoint is not.
      #
      # If this fails: upload the macOS DMG to the draft release, then re-run
      # this job. It is idempotent.
      # Attach the manifest to the GitHub release, so the fallback endpoint
      # declared in tauri.conf.json actually exists.
      #
      # tauri.conf.json lists two endpoints and tries them in order:
      #   1. https://juralabs.org/api/updates/latest.json
      #   2. https://github.com/.../releases/latest/download/latest.json
      #
      # Endpoint 2 returned 404 from launch until 6 September 2026, because no
      # latest.json was ever attached to a release. There was no fallback,
      # only the appearance of one.
      #
      # That became load-bearing when the installer test found endpoint 1
      # returns 403 to datacentre clients: Cloudflare Bot Fight Mode is
      # enabled zone-wide on juralabs.org. Anyone egressing through a
      # corporate proxy, a SASE provider or a commercial VPN was blocked from
      # the primary endpoint and had nothing to fall back to. For a product
      # used by journalists on VPNs and institutions behind proxies, that is
      # not a fringe population. See BL-REL-004.
      #
      # Uploaded BEFORE the completeness assertion below, deliberately. The
      # release is still a draft here, so an incomplete manifest reaching the
      # release asset is not yet reaching users, and the assertion still stops
      # the publish. Uploading after it would mean a failed assertion leaves
      # the fallback stale at the PREVIOUS release's manifest, which is the
      # fail-open shape this file has been cleared of elsewhere.
      - name: Attach the update manifest to the release
        if: steps.manifest.outputs.wrote_manifest == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
          MANIFEST_NAME: ${{ steps.manifest.outputs.manifest_name }}
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest_path }}
        run: |
          set -euo pipefail
          # gh names the asset after the file on disk, so the upload has to use
          # a path whose basename is the canonical manifest name.
          #
          # The first version of this step assumed manifest_path was a temp
          # name and copied unconditionally. It is not: the manifest job
          # already writes /tmp/<manifest_name>, so the copy was a file onto
          # itself, which cp refuses, and set -e killed the step. That is how
          # this failed on its first real execution in the 7 September smoke
          # run — a fault no CI job could have surfaced, because CI never runs
          # this workflow.
          dest="$(dirname "$MANIFEST_PATH")/${MANIFEST_NAME}"
          if [ "$dest" != "$MANIFEST_PATH" ]; then
            cp "$MANIFEST_PATH" "$dest"
          fi
          gh release upload "$RELEASE_TAG" "$dest" \
            --repo juralabs/jura-trace --clobber
          echo "Attached ${MANIFEST_NAME} to ${RELEASE_TAG}."
          echo "The fallback endpoint now resolves for clients that cannot reach juralabs.org."

      - name: Assert the manifest covers every platform before going live
        if: steps.manifest.outputs.wrote_manifest == 'true'
        shell: bash
        env:
          PLATFORM_KEYS: ${{ steps.manifest.outputs.platform_keys }}
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest_path }}
        run: |
          set -euo pipefail
          EXPECTED="darwin-aarch64,linux-x86_64,windows-x86_64"
          echo "Manifest platforms: ${PLATFORM_KEYS:-<none>}"
          echo "Expected:           ${EXPECTED}"

          missing=""
          for want in darwin-aarch64 linux-x86_64 windows-x86_64; do
            case ",${PLATFORM_KEYS}," in
              *",${want},"*) ;;
              *) missing="${missing} ${want}" ;;
            esac
          done

          if [ -n "${missing}" ]; then
            echo "::error::Manifest is missing:${missing}"
            echo "Clients on those platforms would be told they are up to date, forever,"
            echo "with no error shown to them and none recorded here."
            echo ""
            echo "This is expected when the macOS DMG has not been uploaded yet."
            echo "Upload it to the draft release, then re-run this job."
            exit 1
          fi

          # Signatures must be inline minisign blobs, never URLs. A URL here
          # returns HTTP 200 with well-formed JSON and fails every update,
          # which is exactly what shipped from 18 June to 4 September 2026.
          if jq -e '[.platforms[].signature] | map(select(test("^https?://"))) | length > 0' "${MANIFEST_PATH}" >/dev/null; then
            echo "::error::A signature field contains a URL rather than the signature itself."
            exit 1
          fi
          echo "OK: all three platforms present, all signatures inline."

      # ── JTV-146: push the manifest to juralabs.org ───────────────────────
      # Tauri's dual-endpoint config (JTV-147) lists juralabs.org first and
      # GitHub Releases second.  This step makes juralabs.org the primary
      # auto-updater endpoint by pushing the same manifest there atomically:
      # write to .tmp on the VPS, then mv to the final path so a partial
      # write never lands on the live URL.  GitHub Releases (already
      # populated by the previous step) remains the safety-net fallback.
      #
      # Skipped when:
      #   - The previous step produced no manifest (RC / alpha tags), OR
      #   - JURALABS_DEPLOY_KEY is not set in repo Secrets
      #     (typical during the JTV-146 / JTV-147 migration window before
      #     the deploy user is provisioned on the Hetzner VPS).
      #
      # Corrected 4 September 2026. This comment used to say failure here
      # does not fail the workflow, "because the GitHub Releases manifest is
      # already up, so Tauri clients will succeed via the fallback endpoint".
      # Both halves were wrong.
      #
      # The fallback endpoint returns 404 in production: no latest.json asset
      # has ever been attached to a release, so there is no fallback to
      # succeed via. And a failed push does not leave clients without a
      # manifest, it leaves them with the PREVIOUS one, which pins every
      # existing user to the old version while the run reports success.
      #
      # A false comment is what caused the signature-URL bug two hundred
      # lines up. This one justified a continue-on-error that has now been
      # removed.
      #
      # Required Secrets when active:
      #   JURALABS_DEPLOY_KEY      — SSH private key for the deploy user on
      #                              the Hetzner VPS, with write access only
      #                              to /var/www/juralabs.org/public/api/updates/
      #                              and /var/www/juralabs.org/public/downloads/.
      #                              Do NOT reuse the root or git keypair.
      #   JURALABS_HOST            — host name or IP of the Hetzner VPS
      #
      # Optional Secrets (Cloudflare cache purge):
      #   CLOUDFLARE_API_TOKEN     — token scoped to cache-purge on the
      #                              juralabs.org zone only
      #   CLOUDFLARE_ZONE_ID       — Cloudflare zone identifier for juralabs.org
      #
      # See docs/strategy/auto-updater-juralabs-config.md for full details
      # including the Caddyfile snippet (VPS-side, not in this repo).
      # NOT continue-on-error. It was, and that is the fail-open pattern
      # again: a silent push failure leaves the PREVIOUS manifest live on the
      # primary endpoint, which pins every existing user to the old version
      # indefinitely while the run shows green. A push that fails should stop
      # the release, because the alternative is worse than a failed release.
      - name: Push update manifest to juralabs.org
        if: steps.manifest.outputs.wrote_manifest == 'true' && env.HAS_DEPLOY_KEY == 'true'
        env:
          HAS_DEPLOY_KEY: ${{ secrets.JURALABS_DEPLOY_KEY != '' && 'true' || 'false' }}
          JURALABS_DEPLOY_KEY: ${{ secrets.JURALABS_DEPLOY_KEY }}
          JURALABS_HOST: ${{ secrets.JURALABS_HOST }}
          MANIFEST_NAME: ${{ steps.manifest.outputs.manifest_name }}
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest_path }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        shell: bash
        run: |
          set -euo pipefail

          REMOTE_DIR="/var/www/juralabs.org/public/api/updates"
          REMOTE_FINAL="${REMOTE_DIR}/${MANIFEST_NAME}"
          REMOTE_TMP="${REMOTE_DIR}/${MANIFEST_NAME}.tmp"

          # Validate JSON before doing anything remote — defence in depth
          # against a malformed manifest reaching the live endpoint.
          jq . "${MANIFEST_PATH}" > /dev/null

          # Materialise the deploy private key with restrictive perms.
          # GHA-managed temp file, cleaned up at job end.
          mkdir -p ~/.ssh
          KEY_FILE=~/.ssh/juralabs_deploy
          printf '%s\n' "${JURALABS_DEPLOY_KEY}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"

          # Use accept-new so a brand-new VPS does not require a manual
          # known_hosts seed in the repo, while still rejecting a host-key
          # CHANGE (which would indicate MitM).
          SSH_OPTS="-i ${KEY_FILE} -o StrictHostKeyChecking=accept-new -o BatchMode=yes"

          echo "Uploading ${MANIFEST_NAME} to ${JURALABS_HOST}:${REMOTE_TMP} ..."
          scp ${SSH_OPTS} "${MANIFEST_PATH}" "deploy@${JURALABS_HOST}:${REMOTE_TMP}"

          echo "Atomic rename → ${REMOTE_FINAL}"
          ssh ${SSH_OPTS} "deploy@${JURALABS_HOST}" "mv '${REMOTE_TMP}' '${REMOTE_FINAL}'"

          # Optional: purge Cloudflare cache for the manifest URL so the
          # new release becomes visible immediately rather than waiting
          # for the 5-minute Caddy max-age to expire.  Skipped silently
          # when CLOUDFLARE_API_TOKEN / CLOUDFLARE_ZONE_ID are not set.
          if [ -n "${CLOUDFLARE_API_TOKEN}" ] && [ -n "${CLOUDFLARE_ZONE_ID}" ]; then
            echo "Purging Cloudflare cache for /api/updates/${MANIFEST_NAME}"
            curl -fsS -X POST \
              "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"files\":[\"https://juralabs.org/api/updates/${MANIFEST_NAME}\"]}" \
              | jq -r '.success'
          else
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ZONE_ID not set — skipping cache purge"
            echo "(Manifest will become visible after the 5-minute Caddy max-age TTL expires.)"
          fi

          # Verify what the endpoint actually serves, rather than assuming the
          # scp worked. This is the "prove it ran" rule: the push exiting 0
          # says bytes moved, not that the right manifest is live.
          #
          # Retries because the edge cache may take a moment even after a
          # purge. Fails the job if the live manifest never reflects this
          # release: a stale manifest on the primary endpoint is the failure
          # that strands users, so it must not pass quietly.
          echo "Verifying https://juralabs.org/api/updates/${MANIFEST_NAME}"
          EXPECTED_VERSION="$(jq -r .version "${MANIFEST_PATH}")"
          live=""
          for attempt in 1 2 3 4 5 6; do
            live="$(curl -fsSL "https://juralabs.org/api/updates/${MANIFEST_NAME}" || true)"
            if [ -n "${live}" ] && [ "$(printf '%s' "${live}" | jq -r .version)" = "${EXPECTED_VERSION}" ]; then
              echo "Live manifest is ${EXPECTED_VERSION}: $(printf '%s' "${live}" | jq -r '.platforms | keys | join(", ")')"
              break
            fi
            echo "Attempt ${attempt}: live manifest not yet ${EXPECTED_VERSION}, waiting 15s ..."
            live=""
            sleep 15
          done

          if [ -z "${live}" ]; then
            echo "::error::The live endpoint is not serving ${EXPECTED_VERSION} after six attempts."
            echo "Existing users would keep receiving the previous manifest, so they would"
            echo "silently stay on the old version. Check the VPS path, the Caddy config"
            echo "and the Cloudflare cache before treating this release as delivered."
            exit 1
          fi

          # The live manifest must also carry every platform and inline
          # signatures. The gate earlier checked the file we generated; this
          # checks what the world can actually fetch.
          printf '%s' "${live}" | jq -e '(.platforms | keys | sort) == ["darwin-aarch64","linux-x86_64","windows-x86_64"]' >/dev/null || {
            echo "::error::Live manifest does not carry all three platforms."
            exit 1
          }
          printf '%s' "${live}" | jq -e '[.platforms[].signature] | map(select(test("^https?://"))) | length == 0' >/dev/null || {
            echo "::error::Live manifest has a URL in a signature field."
            exit 1
          }
          echo "OK: live manifest verified."

      # Every download link in the release body must resolve to an asset that
      # was actually uploaded.
      #
      # The body is composed in create-release, which runs BEFORE any artefact
      # exists, so it cannot list what the build produced — it states an
      # intention and nothing has ever checked that the intention was met. That
      # is how v1.0.0 came to advertise a Linux AppImage, listed above the .deb,
      # that the pipeline stopped building when Linux went --bundles deb only.
      # Every Linux visitor since 18 June was offered a 404 (BL-REL-003).
      #
      # Runs before Publish rather than after, so a mismatch leaves the release
      # a draft instead of going public and being corrected afterwards.
      - name: Every link in the release body is an uploaded asset
        env:
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          body=$(gh release view "$RELEASE_TAG" --repo juralabs/jura-trace --json body --jq .body)
          assets=$(gh release view "$RELEASE_TAG" --repo juralabs/jura-trace --json assets --jq '.assets[].name')

          # Filenames referenced by a releases/download/ URL in the body.
          linked=$(printf '%s' "$body" \
            | grep -oE 'releases/download/[^/]+/[A-Za-z0-9._-]+' \
            | sed 's|.*/||' | sort -u || true)

          if [ -z "$linked" ]; then
            echo "::error::No download links found in the release body. The table did not render."
            exit 1
          fi

          missing=""
          for f in $linked; do
            printf '%s\n' "$assets" | grep -qxF "$f" || missing="$missing $f"
          done

          if [ -n "$missing" ]; then
            echo "::error::Release body links files that were never uploaded:$missing"
            echo "Uploaded assets are:"
            printf '%s\n' "$assets" | sed 's/^/  /'
            echo ""
            echo "Either the build stopped producing them, or the notes template is stale."
            echo "Do not publish. See BL-REL-003."
            exit 1
          fi
          echo "OK: all $(printf '%s\n' "$linked" | wc -l | tr -d ' ') linked file(s) are uploaded assets."

      - name: Publish release
        # Only auto-publish when EVERY platform built in CI. macOS is built
        # locally and uploaded after this run (its CI job fails at the known
        # Phase 5 codesign step), so in normal operation this step is skipped
        # and the release stays a DRAFT for manual publish once the macOS
        # artefacts are attached. SHA256SUMS and manifest generation above
        # still run regardless, so the draft is fully populated for Win/Linux.
        # Without this guard the SHA256SUMS gating (needs.build can be failure)
        # would publish a macOS-less release the moment CI finishes.
        #
        # The `platforms` clause is the second half, and it is not redundant.
        # `needs.build.result == 'success'` means "every job that RAN
        # succeeded" — not "every platform was built". Under a `linux-only`
        # or `windows-only` dispatch the matrix has one entry, so a green
        # single-platform build satisfies it and this step would publish a
        # release missing two platforms. The completeness gate above does
        # currently catch that case, and it fired on 7 September. But a
        # publish should be blocked by saying what it requires, not by
        # depending on a different assertion happening to fail first.
        # Partial dispatches are for diagnostics; they leave a draft.
        if: needs.build.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all')
        # Uses RELEASE_PAT to flip the draft release to published on
        # juralabs/jura-trace (the public releases repo).
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          github-token: ${{ secrets.RELEASE_PAT }}
          script: |
            await github.rest.repos.updateRelease({
              owner: 'juralabs',
              repo: 'jura-trace',
              release_id: process.env.RELEASE_ID,
              draft: false,
            });
            console.log(`Published release ${process.env.RELEASE_ID} on juralabs/jura-trace`);
