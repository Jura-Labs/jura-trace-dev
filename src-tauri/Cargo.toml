[package]
name = "jura-archive"
version = "0.1.0"
description = "Local-first content protection and verification"
authors = ["Juralabs CIC"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "jura_archive_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
thiserror = "1"
log = "0.4"
env_logger = "0.11"

# File type detection (magic bytes)
infer = "0.16"

# EXIF metadata extraction
kamadak-exif = "0.5"

# Image processing (dimensions, basic info)
image = "0.25"

# C2PA Content Credentials (Phase 1, Weeks 7-8)
c2pa = { version = "0.76", features = ["file_io"] }

# Certificate generation for C2PA signing
rcgen = "0.13"
# time is a direct dependency of rcgen; we use OffsetDateTime for cert validity
time = { version = "0.3", features = ["std"] }

# Perceptual hashing (Phase 1, Weeks 9-10)
image_hasher = "3.1"

# HTTP client for Python ML sidecar (Phase 2)
reqwest = { version = "0.12", features = ["blocking", "multipart", "json"] }

# Temp files for URL verification
tempfile = "3"

[dev-dependencies]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
