[package]
name = "jura-trace"
version = "1.1.0"
description = "Local-first content verification and protection. In a world of synthetic media, verification matters."
authors = ["Paul Griffiths"]
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Jura-Labs/jura-trace-dev"
homepage = "https://juralabs.org"
# With the introduction of the `gen-detectors` codegen binary (commit
# 485856a), `cargo run` without a `--bin` flag can no longer pick a
# default. Pin it to the main Tauri binary so `cargo tauri dev`,
# `cargo run`, and the Makefile's `make dev-tauri` target all keep
# working without needing to pass `--bin jura-trace` explicitly.
default-run = "jura-trace"

[lib]
name = "jura_trace_lib"
crate-type = ["lib", "cdylib", "staticlib"]

# ── Codegen binary ────────────────────────────────────────────────────────
# Generates ui/src/lib/generated/expectedDetectors.ts from the Rust
# MODE_MATRIX constant — the single source of truth for expected detectors
# per (mode × content-type) combination.  Run via:
#   cargo run --bin gen-detectors -- <repo-root>
# or let `npm run predev` / `npm run prebuild` invoke it automatically.
# The REST API without the desktop window (v1.2.0 B2a). The logic is in the
# library's `headless` module; this target only passes it the arguments.
#
# Not in any installer yet, and two things keep it out; both matter.
# 1. The source is NOT in src/bin/. tauri-cli bundles every file in src/bin
#    by its file stem: 2.10.1 (the local CLI on 1 October 2026) does so
#    regardless of required-features, so src/bin/jura_trace_api.rs made the
#    macOS bundle step fail looking for an unbuilt "jura_trace_api".
# 2. required-features = ["api"]. tauri-cli 2.11.4 (release.yml) bundles a
#    [[bin]] only when its required features are passed explicitly with
#    --features, and neither release.yml nor build-local-mac.sh passes any.
# Checked by bundling with both CLIs: the app holds jura-trace, jura-sidecar
# and gen-detectors only. Shipping this binary is stage 5 of the design.
[[bin]]
name = "jura-trace-api"
path = "src/headless_main.rs"
required-features = ["api"]

[[bin]]
name = "gen-detectors"
path = "src/bin/gen_detectors.rs"
required-features = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
csv = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"

# File type detection (magic bytes)
infer = "0.16"

# EXIF metadata extraction
kamadak-exif = "0.5"

# Image processing (dimensions, basic info)
image = "0.25"

# C2PA provenance manifests (Phase 1, Weeks 7-8)
c2pa = { version = "0.90", features = ["file_io"] }

# Certificate generation for C2PA signing.
# x509-parser feature enables CertificateParams::from_ca_cert_pem, required for
# conformant cert import metadata extraction. x509-parser is already compiled as
# a transitive dependency of c2pa; enabling this feature adds no new crate.
rcgen = { version = "0.13", features = ["x509-parser"] }
# Direct X.509 parsing for issuer DN extraction — rcgen's CertificateParams
# exposes the subject distinguished name but not the issuer, so we read the
# issuer RDN SEQUENCE directly via x509-parser. Already compiled as a
# transitive dep of c2pa and rcgen; no new crate added to the build.
x509-parser = "0.18"
# time is a direct dependency of rcgen; we use OffsetDateTime for cert validity
time = { version = "0.3", features = ["std"] }

# Perceptual hashing (Phase 1, Weeks 9-10)
image_hasher = "3.1"

# HTTP client for Python ML sidecar (Phase 2)
reqwest = { version = "0.12", features = ["blocking", "multipart", "json"] }
url = "2"

# Temp files for URL verification
tempfile = "3"

# Base64 decoding for heatmap file extraction
base64 = "0.23"

# PDF internal provenance parsing (Feature 4)
lopdf = "0.42"

# Frequency-domain invisible watermarking (DWT-DCT-SVD, Phase 3)
blind_watermark = "0.1"
bitvec = "1"

# HTTP server for local REST API wrapper (port 8300)
axum = { version = "0.8", features = ["multipart"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.7", features = ["cors", "trace", "limit"], optional = true }
utoipa = { version = "5", features = ["axum_extras"], optional = true }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"], optional = true }
dashmap = { version = "6", optional = true }
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "macros", "sync", "signal", "time"], optional = true }

# BL-PERF-001: the Windows orphan-sidecar sweep enumerates processes in
# process instead of waiting on a taskkill child. Already in Cargo.lock as a
# transitive dependency; only the three API families it needs are enabled.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[dev-dependencies]
# Integration test helpers (API wrapper tests)
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }

[features]
default = ["custom-protocol", "api"]
custom-protocol = ["tauri/custom-protocol"]
api = ["axum", "tower", "tower-http", "utoipa", "utoipa-swagger-ui", "dashmap", "tokio"]
# The two REST watermark routes. Off by default: watermarking is not in this
# release (V1_SHOW_WATERMARK = false, BL-WM-001), so the routes and their
# OpenAPI entries are compiled out rather than advertised and answered 503.
watermark = ["api"]

# Dev-profile speedup (2026-06-12): optimise DEPENDENCIES at O2 while keeping
# this crate's own code unoptimised for fast incremental builds and usable
# debugging. Without this, `cargo tauri dev` runs image decode, perceptual
# hashing and C2PA crypto 10-40x slower than release, making a deep verify
# take minutes instead of ~20 s and dev-build manual testing unrepresentative.
# Release builds are unaffected.
[profile.dev.package."*"]
opt-level = 2
