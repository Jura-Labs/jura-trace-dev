#
# OSV-Scanner configuration for the fuzz crate's lockfile. This lockfile
# started as a copy of ../Cargo.lock, so the crates it shares with the app
# are the same versions, and the four advisories below are the same ones
# ../osv-scanner.toml already ignores, for the same crates (image's AVIF
# encoder and lopdf), with the same reasons and expiry. Copied, not new:
# when an entry leaves ../osv-scanner.toml, it leaves here too.
#
# The fuzz crate is a test harness that never ships. The rule in
# ../.cargo/audit.toml still applies: adding an entry here that is not in
# ../osv-scanner.toml is a decision, not a cleanup.

