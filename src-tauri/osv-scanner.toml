# ── block-buffer 0.10 ───────────────────────────────────────────────────────
# A panic inside the compression callback, caught and followed by more use of
# the same hasher, can corrupt the buffer. The callbacks are the RustCrypto
# hash cores, which do not panic, and we do not catch_unwind around hashing.
# Fixed in 0.12.1, which needs the digest 0.11 generation (sha2 0.11, #154,
# and c2pa's ed25519-dalek). Out when block-buffer 0.10 leaves the tree.
[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2027-01-31T00:00:00Z
reason = "block-buffer 0.10 caught-panic corruption; hash cores do not panic and nothing catches panics around hashing; fix needs digest 0.11"

