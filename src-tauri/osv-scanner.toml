# OSV-Scanner workflow and, if it honours it, by OpenSSF Scorecard.
#
# The rule from src-tauri/.cargo/audit.toml applies: an entry here hides an
# advisory, so adding one is a decision, not a cleanup. Each entry names the
# advisory, says why the exposure does not apply to Jura Trace or why no fix
# exists yet, and expires on ignoreUntil, after which it is reported again
# and has to be re-checked. Never add one to make a scan pass.
#
# Proposed 28 October 2026. Not in force until Paul approves it.

# ── zip before 9.0.0 ─────────────────────────────────────────────────────────
# Already ignored for cargo audit in src-tauri/.cargo/audit.toml (#182,
# approved by Paul 17 October 2026), which has the full reasoning: the
# updater extracts only signature-checked archives, utoipa-swagger-ui reads
# its own vendored bundle at build time, and our code makes no archive calls.
# Out when `cargo tree -i zip` shows nothing below 9.0.0.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0367"
ignoreUntil = 2027-01-31T00:00:00Z
reason = "zip extraction; same as .cargo/audit.toml (#182): no untrusted archive is extracted"

